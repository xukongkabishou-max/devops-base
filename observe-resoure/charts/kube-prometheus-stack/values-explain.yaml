      revisionHistoryLimit: 10

      ## Prometheus-Operator v0.39.0 及更高版本原生支持 TLS。
      ##
      tls:
        enabled: true
        # 值必须与 https://pkg.go.dev/crypto/tls#pkg-constants 中的版本名称匹配
        tlsMinVersion: VersionTLS13
        # 默认的 webhook 端口为 10250，以便在 GKE 私有集群中即开即用，并避免添加防火墙规则。
        internalPort: 10250

      ## Prometheus Operator Webhook 使用的服务帐户。
      ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
      ##
      serviceAccount:
        annotations: {}
        automountServiceAccountToken: false
        create: true
        name: ""

      ## Prometheus Operator Webhook 服务的配置
      ##
      service:
        annotations: {}
        labels: {}
        clusterIP: ""
        ipDualStack:
          enabled: false
          ipFamilies: ["IPv6", "IPv4"]
          ipFamilyPolicy: "PreferDualStack"

        ## 在每个节点上公开的端口
        ## 仅在 service.type 为 'NodePort' 时使用
        ##
        nodePort: 31080

        nodePortTls: 31443

        ## 为 Prometheus Operator Webhook 服务打开的附加端口
        ## ref: https://kubernetes.io/docs/concepts/services-networking/service/#multi-port-services
        ##
        additionalPorts: []

        ## 负载均衡器 IP
        ## 仅在 service.type 为 "LoadBalancer" 时使用
        ##
        loadBalancerIP: ""
        loadBalancerSourceRanges: []

        ## 指示此服务是否希望将外部流量路由到节点本地或集群范围的端点
        ##
        externalTrafficPolicy: Cluster

        ## 服务类型
        ## NodePort, ClusterIP, LoadBalancer
        ##
        type: ClusterIP

        ## Prometheus 服务器服务可用的 IP 地址列表
        ## Ref: https://kubernetes.io/docs/concepts/services-networking/service/#external-ips
        ##
        externalIPs: []

      # ## 要添加到操作符 webhook 部署的标签
      # ##
      labels: {}

      ## 要添加到操作符 webhook 部署的注解
      ##
      annotations: {}

      ## 要添加到操作符 webhook pod 的标签
      ##
      podLabels: {}

      ## 要添加到操作符 webhook pod 的注解
      ##
      podAnnotations: {}

      ## 如果设置，为 Pod 分配 PriorityClassName
      # priorityClassName: ""

      ## 定义日志格式
      # 使用 logfmt (默认) 或 json 日志记录
      # logFormat: logfmt

      ## 将日志详细程度降低到仅错误
      # logLevel: error


      ## Prometheus-operator webhook 镜像
      ##
      image:
        registry: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/quay.io
        repository: prometheus-operator/admission-webhook
        # 如果未设置，则使用 Chart.yaml 中的 appVersion 字段
        tag: ""
        sha: ""
        pullPolicy: IfNotPresent

      ## 定义日志格式
      # 使用 logfmt (默认) 或 json 日志记录
      # logFormat: logfmt

      ## 将日志详细程度降低到仅错误
      # logLevel: error


      ## 活跃度探测
      ##
      livenessProbe:
        enabled: true
        failureThreshold: 3
        initialDelaySeconds: 30
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 1

      ## 就绪性探测
      ##
      readinessProbe:
        enabled: true
        failureThreshold: 3
        initialDelaySeconds: 5
        periodSeconds: 10
        successThreshold: 1
        timeoutSeconds: 1

      ## 资源限制和请求
      ##
      resources: {}
      # limits:
      #   cpu: 200m
      #   memory: 200Mi
      # requests:
      #   cpu: 100m
      #   memory: 100Mi

      # 对于使用自定义 CNI（如 calico）的托管 Kubernetes 集群（如 AWS EKS）是必需的，
