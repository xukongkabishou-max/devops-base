# kube-prometheus-stack 默认配置。
# 这是一个 YAML 格式的文件。
# 声明将传递给模板的变量。

## 为 `app:` 标签提供一个名称来代替 kube-prometheus-stack
##
nameOverride: "kube-prom-stack"

## 覆盖部署的命名空间
##
namespaceOverride: ""

## 为自动导入仪表盘脚本提供一个 Kubernetes 版本，例如：kubeTargetVersionOverride: 1.26.6
##
kubeTargetVersionOverride: ""

## 允许在创建 ingress 时覆盖 Kubernetes 版本
##
kubeVersionOverride: ""

## 提供一个名称来替代资源的完整名称
##
fullnameOverride: ""

## 应用于所有资源的标签
##
commonLabels: {}
# scmhash: abc123
# myLabel: aakkmd

## 安装 Prometheus Operator CRD
##
crds:
  enabled: true
  ## CRD 升级任务用于缓解 Helm 无法升级 CRD 的限制。
  ## 该任务将使用 Helm Hook 在 Operator 部署之前将 CRD 应用到集群中。
  ## 它会部署相应的 ClusterRole、ClusterRoleBinding 和 ServiceAccount 来应用 CRD。
  ## 此功能处于预览阶段，默认关闭，未来可能会有变化。
  upgradeJob:
    enabled: false
    forceConflicts: false
    image:
      busybox:
        registry: docker.io
        repository: busybox
        tag: "latest"
        sha: ""
        pullPolicy: IfNotPresent
      kubectl:
        registry: registry.k8s.io
        repository: kubectl
        tag: ""  # 默认为 Kubernetes 版本
        sha: ""
        pullPolicy: IfNotPresent

    env: {}
    ## 定义单个 Pod 的资源请求和限制。
    ## 参考: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    ##
    resources: {}

    ## 额外的卷
    ##
    extraVolumes: []

    ## 额外的卷挂载
    ##
    extraVolumeMounts: []

    ## 定义 Pods 被调度到哪些节点上。
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
    ##
    nodeSelector: {}

    ## 为 upgrade-crd 任务分配自定义亲和性规则
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
    ##
    affinity: {}
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #     - matchExpressions:
    #       - key: kubernetes.io/e2e-az-name
    #         operator: In
    #         values:
    #         - e2e-az1
    #         - e2e-az2

    ## 如果指定，则为 Pod 的容忍度。
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
    ##
    tolerations: []
    # - key: "key"
    #   operator: "Equal"
    #   value: "value"
    #   effect: "NoSchedule"

    ## 如果指定，则为 Pod 的拓扑分布约束。
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
    ##
    topologySpreadConstraints: []
    # - maxSkew: 1
    #   topologyKey: topology.kubernetes.io/zone
    #   whenUnsatisfiable: DoNotSchedule
    #   labelSelector:
    #     matchLabels:
    #       app: alertmanager

    # ## 添加到 upgrade-crd 任务的标签
    # ##
    labels: {}

    ## 添加到 upgrade-crd 任务的注解
    ##
    annotations: {}

    ## 添加到 upgrade-crd Pod 的标签
    ##
    podLabels: {}

    ## 添加到 upgrade-crd Pod 的注解
    ##
    podAnnotations: {}

    ## upgrade-crd 任务使用的服务账户。
    ## 参考: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
    ##
    serviceAccount:
      create: true
      name: ""
      annotations: {}
      labels: {}
      automountServiceAccountToken: true

    ## 容器特定的安全上下文配置
    ## 参考: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    ##
    containerSecurityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL

    ## SecurityContext 包含 Pod 级别的安全属性和通用的容器设置。
    ## 默认使用非 root 用户，UID 为 1000，GID 为 2000。*v1.PodSecurityContext false
    ## 参考: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    ##
    podSecurityContext:
      fsGroup: 65534
      runAsGroup: 65534
      runAsNonRoot: true
      runAsUser: 65534
      seccompProfile:
        type: RuntimeDefault

## 自定义规则，用于覆盖 defaultRules 中的 "for" 和 "severity"
##
customRules: {}
  # AlertmanagerFailedReload:
  #   for: 3m
  # AlertmanagerMembersInconsistent:
  #   for: 5m
  #   severity: "warning"

## 为集群prometheus监控创建默认规则
##
defaultRules:
  create: false
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sContainerMemorySwap: true
    k8sContainerResource: true
    k8sContainerMemoryWorkingSetBytes: true
    k8sPodOwner: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true
    windows: true

  # 定义operator来监控哪些命名空间选择的运算符
  # 使用 "=~" 来包含与模式匹配的命名空间（默认）
  # 使用 "!~" 来排除与模式匹配的命名空间
  appNamespacesOperator: ".*"

  ## 缩小应用命名空间警报范围，.*为监控所有命名空间
  appNamespacesTarget: ".*"

  ## 设置所有警报的 keep_firing_for
  keepFiringFor: ""

  ## 默认规则的标签
  labels: {}
  ## 默认规则的注解
  annotations: {}

  ## PrometheusRule 警报的额外标签
  additionalRuleLabels: {}

  ## PrometheusRule 警报的额外注解
  additionalRuleAnnotations: {}

  ## 特定 PrometheusRule 警报组的额外标签
  additionalRuleGroupLabels:
    alertmanager: {}
    etcd: {}
    configReloaders: {}
    general: {}
    k8sContainerCpuUsageSecondsTotal: {}
    k8sContainerMemoryCache: {}
    k8sContainerMemoryRss: {}
    k8sContainerMemorySwap: {}
    k8sContainerResource: {}
    k8sPodOwner: {}
    kubeApiserverAvailability: {}
    kubeApiserverBurnrate: {}
    kubeApiserverHistogram: {}
    kubeApiserverSlos: {}
    kubeControllerManager: {}
    kubelet: {}
    kubeProxy: {}
    kubePrometheusGeneral: {}
    kubePrometheusNodeRecording: {}
    kubernetesApps: {}
    kubernetesResources: {}
    kubernetesStorage: {}
    kubernetesSystem: {}
    kubeSchedulerAlerting: {}
    kubeSchedulerRecording: {}
    kubeStateMetrics: {}
    network: {}
    node: {}
    nodeExporterAlerting: {}
    nodeExporterRecording: {}
    prometheus: {}
    prometheusOperator: {}

  ## 特定 PrometheusRule 警报组的额外注解
  additionalRuleGroupAnnotations:
    alertmanager: {}
    etcd: {}
    configReloaders: {}
    general: {}
    k8sContainerCpuUsageSecondsTotal: {}
    k8sContainerMemoryCache: {}
    k8sContainerMemoryRss: {}
    k8sContainerMemorySwap: {}
    k8sContainerResource: {}
    k8sPodOwner: {}
    kubeApiserverAvailability: {}
    kubeApiserverBurnrate: {}
    kubeApiserverHistogram: {}
    kubeApiserverSlos: {}
    kubeControllerManager: {}
    kubelet: {}
    kubeProxy: {}
    kubePrometheusGeneral: {}
    kubePrometheusNodeRecording: {}
    kubernetesApps: {}
    kubernetesResources: {}
    kubernetesStorage: {}
    kubernetesSystem: {}
    kubeSchedulerAlerting: {}
    kubeSchedulerRecording: {}
    kubeStateMetrics: {}
    network: {}
    node: {}
    nodeExporterAlerting: {}
    nodeExporterRecording: {}
    prometheus: {}
    prometheusOperator: {}

  additionalAggregationLabels: []

  ## 运行手册 URL 前缀。用于覆盖所有规则共有的运行手册 URL 的第一部分。
  runbookUrl: "https://runbooks.prometheus-operator.dev/runbooks"

  #fsSelector 决定 Node Exporter 收集哪些磁盘/分区的使用数据
   #'fstype!=""' → 全部非空文件系统
    #fstype=~"ext[234]|btrfs|xfs|zfs"' → 只收集常用磁盘类型
  node:
    fsSelector: 'fstype!=""'
    # fsSelector: 'fstype=~"ext[234]|btrfs|xfs|zfs"'

  ## 禁用的 PrometheusRule 警报
  disabled: {}
  # KubeAPIDown: true
  # NodeRAIDDegraded: true

## 不再推荐使用的方式，用于提供要部署到集群中的自定义记录或警报规则。
##
# additionalPrometheusRules: []
#  - name: my-rule-file
#    groups:
#      - name: my_group
#        rules:
#        - record: my_record
#          expr: 100 * my_record

## 提供要部署到集群中的自定义记录或警报规则。
##
additionalPrometheusRulesMap: {}
#  rule-name:
#    groups:
#    - name: my_group
#      rules:
#      - record: my_record
#        expr: 100 * my_record

##
global:
  rbac:
    create: true

    ## 创建 ClusterRole，用于扩展现有的 view、edit 和 admin ClusterRoles，以便与 prometheus-operator CRD 交互
    ## 参考: https://kubernetes.io/docs/reference/access-authn-authz/rbac/#aggregated-clusterroles
    createAggregateClusterRoles: false

  ## 全局镜像仓库，如果因某些特定用例（例如本地仓库、自定义镜像等）需要覆盖，则可以使用
  ##
  imageRegistry: ""

  ## 引用一个或多个用于拉取镜像的 Secret
  ## 参考: https://kubernetes.io/docs/tasks/configure-pod-container/pull-image-private-registry/
  ##
  imagePullSecrets: []
  # - name: "image-pull-secret"
  # or
  # - "image-pull-secret"

windowsMonitoring:
  ## 部署 windows-exporter 和 Windows 特定的仪表盘和规则（任务名必须是 'windows-exporter'）
  enabled: false

## prometheus-windows-exporter 的配置
## 参考: https://github.com/prometheus-community/helm-charts/tree/main/charts/prometheus-windows-exporter
##
prometheus-windows-exporter:
  ## 启用 ServiceMonitor 并设置用作任务标签的 Kubernetes 标签
  ##
  prometheus:
    monitor:
      enabled: true
      jobLabel: jobLabel

  releaseLabel: true

  ## 将任务标签设置为 'windows-exporter'，这是默认 Prometheus 规则和 Grafana 仪表盘所要求的
  ##
  podLabels:
    jobLabel: windows-exporter

  ## 启用内存和容器指标，这是默认 Prometheus 规则和 Grafana 仪表盘所要求的
  ##
  config: |-
    collectors:
      enabled: '[defaults],memory,container'

#alertmanager  实例配置
prometheusalert:
  image: harbor.aliyun.com/middleware/feiyu563/prometheus-alert:v4.9.1-custom
  service:
    nodePort: 30084
  resources:
    limits:
      cpu: 200m
      memory: 200Mi
    requests:
      cpu: 100m
      memory: 100Mi
  config:
    #告警消息标题
    title: 【test】监控告警
    username: prometheusalert
    password: prometheusalert
    ## 飞书机器人 webhook 地址
    feishu:
      fsurl: https://open.feishu.cn/open-apis/bot/v2/hook/99dee9cb-bf9f-43d5-aac4-02ee74699a4e
    ## 企业微信机器人地址
    weixin:
      wxurl: https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxxx
    ## 钉钉告警配置
    dingding:
      ddurl: https://oapi.dingtalk.com/robot/send?access_token=xxxxx
      ## 是否开启 @所有人(0为关闭,1为开启)
      ddIsatall: 1
      #是否开启钉钉机器人加签，0为关闭,1为开启
      # 使用方法：https://oapi.dingtalk.com/robot/send?access_token=XXXXXX&secret=mysecret
      openDingdingSecret: 0
    ## 邮件告警配置
    email:
      ## 邮件发件服务器地址
      emailHost: smtp.feishu.cn
      ## 邮件发件服务器端口
      emailPort: 465
      ## 邮件帐号
      emailUser: alarm@aliyun.cn
      ## 邮件密码
      emailPassword: Vxxxx
      ## 邮件标题
      emailTitle: 【test】监控告警
      ## 默认发送邮箱(收件人), 逗号分隔多个邮件地址
      defaultEmails: caosikai@ecmas.ai

## Alertmanager 的配置
## 参考: https://prometheus.io/docs/alerting/alertmanager/
##
alertmanager:

  ## 部署 Alertmanager
  ##
  enabled: true

  # 可选：覆盖 Alertmanager 的部署命名空间。
  namespaceOverride: ""

  ## Alertmanager 的注解
  ##
  annotations: {}

  ## Alertmanager 的额外标签
  ##
  additionalLabels: {}

  ## Prometheus 将用来与 Alertmanager 通信的 API 版本。可能的值为 v1, v2
  ##
  apiVersion: v2

  ## @param alertmanager.enableFeatures 启用对 Alertmanager 已禁用功能的访问。
  ##
  enableFeatures: []

  ## 即使 Alertmanager 部署已禁用，也创建仪表盘配置映射
  ##
  forceDeployDashboards: false

  ## 网络策略配置
  ##
  networkPolicy:
    # -- 为 Alertmanager 启用网络策略
    enabled: false

    # -- 定义策略类型。如果 egress 启用，将同时使用 Ingress 和 Egress
    # 有效值为 ["Ingress"] 或 ["Ingress", "Egress"]
    ##
    policyTypes:
      - Ingress

    # -- 网关（以前称为 ingress 控制器）配置
    ##
    gateway:
      # -- 网关命名空间
      ##
      namespace: ""
      # -- 网关 Pod 标签
      ##
      podLabels: {}
      # app.kubernetes.io/name: ingress-nginx

    # -- 额外的自定义入站规则
    ##
    additionalIngress: []
    # - from:
    #   - namespaceSelector:
    #       matchLabels:
    #         name: another-namespace
    #     podSelector:
    #       matchLabels:
    #         app: another-app
    # - from:
    #     - podSelector:
    #         matchLabels:
    #           app.kubernetes.io/name: loki
    #   ports:
    #     - port: 9093
    #       protocol: TCP

    # -- 配置出站规则
    ##
    egress:
      # -- 启用出站规则。启用后，policyTypes 将包括 Egress
      ##
      enabled: false
      # -- 自定义出站规则
      ##
      rules: []
      # - to:
      #   - namespaceSelector: {}
      #     podSelector:
      #       matchLabels:
      #         name: smtp-relay
      #   ports:
      #   - port: 25
      #     protocol: TCP

    # -- 启用 Alertmanager 集群流量的规则
    ##
    enableClusterRules: true

    # -- 配置监控组件规则
    ##
    monitoringRules:
      # -- 启用来自 Prometheus 的入站流量
      ##
      prometheus: true
      # -- 启用配置重载器指标的入站流量
      ##
      configReloader: true

  ## Alertmanager 使用的服务账户。
  ## 参考: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  ##
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: true

  ## 为 Alertmanager 配置 PodDisruptionBudget
  ## 参考: https://kubernetes.io/docs/tasks/run-application/configure-pdb/#specifying-a-poddisruptionbudget
  ##
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: ""
    unhealthyPodEvictionPolicy: AlwaysAllow

  ## Alertmanager 配置指令
  ## 参考: https://prometheus.io/docs/alerting/configuration/#configuration-file
  ##      https://prometheus.io/webtools/alerting/routing-tree-editor/
  ##
  config:
    global:
      resolve_timeout: 10m
    inhibit_rules:
      - source_matchers:
          - 'severity = critical'
        target_matchers:
          - 'severity =~ warning|info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'severity = warning'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
          - 'alertname'
      - source_matchers:
          - 'alertname = InfoInhibitor'
        target_matchers:
          - 'severity = info'
        equal:
          - 'namespace'
      - target_matchers:
          - 'alertname = InfoInhibitor'
    route:
      group_by: ['namespace', 'instance', 'alertname', 'severity']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 60m
      receiver: 'web.hook.promalert.feishu'
      routes:
      - receiver: 'web.hook.promalert.feishu'
        continue: true
      - receiver: 'web.hook.promalert.email'
      - receiver: 'null'
        matchers:
          - alertname = "Watchdog"
    receivers:
    - name: 'web.hook.promalert.feishu'
      webhook_configs:
      - url: 'http://prometheus-alert-center:8080/prometheusalert?type=fs&tpl=fs-tpl-pretty&fsurl=https://open.feishu.cn/open-apis/bot/v2/hook/99dee9cb-bf9f-43d5-aac4-02ee74699a4e&split=false'
        send_resolved: false
    - name: 'web.hook.promalert.email'
      webhook_configs:
      - url: 'http://prometheus-alert-center:8080/prometheusalert?type=email&tpl=email-tpl-pretty&email=caosikai@ecmas.ai&split=false'
        send_resolved: true
      # - url: 'http://prometheus-alert-center:8080/prometheusalert?type=email&tpl=email-tpl-pretty&split=false'
    - name: 'null'
    templates:
    - '/etc/alertmanager/config/*.tmpl'


  ## Alertmanager 配置指令（字符串类型，优先于 config 哈希映射）
  ## 只有当 tplConfig 为 true 时，stringConfig 才会被使用
  ## 参考: https://prometheus.io/docs/alerting/configuration/#configuration-file
  ##      https://prometheus.io/webtools/alerting/routing-tree-editor/
  ##
  stringConfig: ""

  ## 将 Alertmanager 配置指令通过 Helm 的模板引擎传递
  ## 如果 Alertmanager 配置包含 Alertmanager 模板，它们需要正确转义，以避免被 Helm 解释
  ## 参考: https://helm.sh/docs/developing_charts/#using-the-tpl-function
  ##      https://prometheus.io/docs/alerting/configuration/#tmpl_string
  ##      https://prometheus.io/docs/alerting/notifications/
  ##      https://prometheus.io/docs/alerting/notification_examples/
  tplConfig: false

  ## Alertmanager 模板文件，用于格式化警报
  ## 默认情况下，模板文件放在 /etc/alertmanager/config/，并且如果它们有 .tmpl 文件后缀，就会被加载。
  ## 参见上面的 config.templates 来更改或添加其他后缀。如果添加其他后缀，请务必更新上面的 config.templates 以包含这些后缀。
  ## 参考: https://prometheus.io/docs/alerting/notifications/
  ##      https://prometheus.io/docs/alerting/notification_examples/
  ##
  templateFiles: {}
  #
  ## 示例模板：
  #   template_1.tmpl: |-
  #       {{ define "cluster" }}{{ .ExternalURL | reReplaceAll ".*alertmanager\\.(.*)" "$1" }}{{ end }}
  #
  #       {{ define "slack.myorg.text" }}
  #       {{- $root := . -}}
  #       {{ range .Alerts }}
  #         *Alert:* {{ .Annotations.summary }} - `{{ .Labels.severity }}`
  #         *Cluster:* {{ template "cluster" $root }}
  #         *Description:* {{ .Annotations.description }}
  #         *Graph:* <{{ .GeneratorURL }}|:chart_with_upwards_trend:>
  #         *Runbook:* <{{ .Annotations.runbook }}|:spiral_note_pad:>
  #         *Details:*
  #           {{ range .Labels.SortedPairs }} - *{{ .Name }}:* `{{ .Value }}`
  #           {{ end }}
  #       {{ end }}
  #       {{ end }}

  ingress:
    enabled: false

    ingressClassName: ""

    annotations: {}

    labels: {}

    ## 覆盖 ingress 到服务上不同的已定义端口
    # servicePort: 8081
    ## 覆盖 ingress 到非默认服务，这对于需要指向特定 Alertmanager 实例（例如 kube-prometheus-stack-alertmanager-0）很有用
    # serviceName: kube-prometheus-stack-alertmanager-0

    ## 如果 Ingress 已启用，必须提供主机。
    ##
    hosts: []
      # - alertmanager.domain.com

    ## 用于 ingress 规则的路径 - 一个路径应该匹配 alertmanagerSpec.routePrefix
    ##
    paths: []
    # - /

    ## 对于 Kubernetes >= 1.18，您应该指定 pathType（确定 Ingress 路径应如何匹配）
    ## 参见 https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#better-path-matching-with-path-types
    # pathType: ImplementationSpecific

    ## Alertmanager Ingress 的 TLS 配置
    ## Secret 必须在命名空间中手动创建
    ##
    tls: []
    # - secretName: alertmanager-general-tls
    #   hosts:
    #   - alertmanager.example.com

  # -- BETA: 在此处配置图表的网关路由。
  # 可以通过添加像 'main' 路由一样的字典键来添加更多路由。
  # 请注意，这是该功能的早期 Beta 版本，
  # kube-prometheus-stack 不保证其正常工作，且未来可能会有变化。
  # 由于是 BETA 版本，它可能会/将会发生变化，恕不另行通知，除非您愿意承担风险，否则请勿使用。
  # [[ref]](https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io%2fv1alpha2)
  route:
    main:
      # -- 启用或禁用路由
      enabled: false

      # -- 设置路由 apiVersion，例如 gateway.networking.k8s.io/v1 或 gateway.networking.k8s.io/v1alpha2
      apiVersion: gateway.networking.k8s.io/v1
      # -- 设置路由类型
      # 有效选项为 GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
      kind: HTTPRoute

      annotations: {}
      labels: {}

      hostnames: []
      # - my-filter.example.com
      parentRefs: []
      # - name: acme-gw

      # -- 创建用于重定向的 http 路由 (https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/#http-to-https-redirects)
      ## 请注意，只在网关的 http 监听器上启用此功能，以避免无限重定向。
      ## 如果此项设置为 true，matches、filters 和 additionalRules 将被忽略。
      httpsRedirect: false

      matches:
        - path:
            type: PathPrefix
            value: /

      ## Filters 定义应用于匹配此规则的请求的过滤器。
      filters: []

      ## 可以添加到路由的额外自定义规则
      additionalRules: []

  ## Alertmanager Secret 的配置
  ##
  secret:
    annotations: {}

  ## 配置创建 Ingress，该 Ingress 将映射到每个 Alertmanager 副本服务
  ## 必须启用 alertmanager.servicePerReplica
  ##
  ingressPerReplica:
    enabled: false

    ingressClassName: ""

    annotations: {}
    labels: {}

    ## 每个副本 ingress 的最终主机名形式为
    ## {{ ingressPerReplica.hostPrefix }}-{{ $replicaNumber }}.{{ ingressPerReplica.hostDomain }}
    ##
    ## 每个副本 ingress 的前缀，末尾会附加 `-$replicaNumber`
    hostPrefix: ""
    ## 每个副本 ingress 将使用的域
    hostDomain: ""

    ## 用于 ingress 规则的路径
    ##
    paths: []
    # - /

    ## 对于 Kubernetes >= 1.18，您应该指定 pathType（确定 Ingress 路径应如何匹配）
    ## 参见 https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#better-path-matching-with-path-types
    # pathType: ImplementationSpecific

    ## 包含 Alertmanager 每个副本 ingress 的 TLS 证书的 Secret 名称
    ## Secret 必须在命名空间中手动创建
    tlsSecretName: ""

    ## 为每个副本 Ingress 分离的 Secret。可与 cert-manager 一起使用
    ##
    tlsSecretPerReplica:
      enabled: false
      ## 每个副本 ingress 的最终 Secret 名称形式为
      ## {{ tlsSecretPerReplica.prefix }}-{{ $replicaNumber }}
      ##
      prefix: "alertmanager"

  ## Alertmanager Service 的配置
  ##
  service:
    enabled: true
    annotations: {}
    labels: {}
    clusterIP: ""
    ipDualStack:
      enabled: false
      ipFamilies: ["IPv6", "IPv4"]
      ipFamilyPolicy: "PreferDualStack"

    ## Alertmanager 服务监听的端口
    ##
    port: 9093
    ## Alertmanager 集群通信的端口
    ##
    # clusterPort: 9094
    ## 用于代理额外容器端口
    ##
    targetPort: 9093
    ## 在每个节点上公开的端口
    ## 仅当 service.type 为 'NodePort' 时使用
    ##
    nodePort: 30002
    ## Prometheus 服务器服务可用的 IP 地址列表
    ## 参考: https://kubernetes.io/docs/concepts/services-networking/service/#external-ips
    ##
    externalIPs: []
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

    ## 表示此服务是否希望将外部流量路由到节点本地或集群范围的端点
    ##
    externalTrafficPolicy: Cluster

    ## 如果您想确保来自特定客户端的连接每次都传递到同一个 Pod
    ## 接受 'ClientIP' 或 'None'
    ##
    sessionAffinity: None

    ## 如果您想修改 ClientIP 会话亲和性超时时间
    ## 当 ServiceAffinity == "ClientIP" 时，值必须 >0 且 <=86400（1天）
    ##
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 10800

    ## 服务类型
    ##
    type: NodePort

  ## 配置为每个有状态集 Alertmanager 副本创建单独的服务
  ##
  servicePerReplica:
    enabled: false
    annotations: {}

    ## Alertmanager 每个副本服务监听的端口
    ##
    port: 9093

    ## 用于代理额外容器端口
    targetPort: 9093

    ## 在每个节点上公开的端口
    ## 仅当 servicePerReplica.type 为 'NodePort' 时使用
    ##
    nodePort: 30002

    ## Loadbalancer 源 IP 范围
    ## 仅当 servicePerReplica.type 为 "LoadBalancer" 时使用
    loadBalancerSourceRanges: []

    ## 表示此服务是否希望将外部流量路由到节点本地或集群范围的端点
    ##
    externalTrafficPolicy: Cluster

    ## 服务类型
    ##
    type: ClusterIP

  ## 配置为 AlertManager 创建 ServiceMonitor
  ##
  serviceMonitor:
    ## 如果为 true，将为 AlertManager 服务创建一个 ServiceMonitor。
    ##
    selfMonitor: true

    ## 抓取间隔。如果未设置，则使用 Prometheus 默认的抓取间隔。
    ##
    interval: ""

    ## 额外的标签
    ##
    additionalLabels: {}

    ## SampleLimit 定义了每个抓取可接受的样本数量限制。
    ##
    sampleLimit: 0

    ## TargetLimit 定义了每个抓取可接受的目标数量限制。
    ##
    targetLimit: 0

    ## 每个抓取可接受的标签数量限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelLimit: 0

    ## 每个抓取可接受的标签名称长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelNameLengthLimit: 0

    ## 每个抓取可接受的标签值长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelValueLengthLimit: 0

    ## proxyUrl: 用于抓取的代理 URL。
    ##
    proxyUrl: ""

    ## scheme: 用于抓取的 HTTP 方案。例如，在使用 istio mTLS 时可与 `tlsConfig` 一起使用。
    scheme: ""

    ## enableHttp2: 是否启用 HTTP2。
    ## 参见 https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#endpoint
    enableHttp2: true

    ## tlsConfig: 抓取端点时使用的 TLS 配置。例如，在使用 istio mTLS 时。
    ## 类型: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#tlsconfig
    tlsConfig: {}

    bearerTokenFile:

    ## MetricRelabelConfigs，在抓取后、摄取前应用于样本。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    metricRelabelings: []
    # - action: keep
    #   regex: 'kube_(daemonset|deployment|pod|namespace|node|statefulset).+'
    #   sourceLabels: [__name__]

    ## RelabelConfigs，在抓取前应用于样本。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    relabelings: []
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace

    ## 额外的端点
    ##
    additionalEndpoints: []
    # - port: oauth-metrics
    #   path: /metrics

  ## 影响 alertmanagerSpec 的设置
  ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#alertmanagerspec
  ##
  alertmanagerSpec:
    ## StatefulSet 的持久卷声明保留策略
    ## whenDeleted 和 whenScaled 分别决定了
    ## StatefulSet 的 PVC 在缩减和删除 StatefulSet 时是删除（true）还是保留（false）。
    ## 需要 Kubernetes 版本 1.27.0+。
    ## 参考: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
    persistentVolumeClaimRetentionPolicy: {}
    #  whenDeleted: Retain
    #  whenScaled: Retain

    ## 标准对象的元数据。更多信息: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#metadata
    ## 元数据标签和注解会传播到 Alertmanager Pods。
    ##
    podMetadata: {}

    ##
    serviceName:

    ## Alertmanager 镜像
    ##
    image:
      registry: quay.io
      repository: prometheus/alertmanager
      tag: v0.28.1
      sha: ""
      pullPolicy: IfNotPresent

    ## 如果为 true，则用户需要负责提供一个包含 Alertmanager 配置的 Secret
    ## 因此，当为 true 时，config 部分将被忽略（包括 templateFiles），并使用 Secret 中的配置
    ##
    useExistingSecret: false

    ## Secrets 是与 Alertmanager 对象在同一命名空间中的 Secret 列表，它们将被挂载到 Alertmanager Pods 中。
    ## Secret 将被挂载到 /etc/alertmanager/secrets/。
    ##
    secrets: []

    ## 如果为 false，则用户将选择不自动挂载 API 凭据。
    ##
    automountServiceAccountToken: true

    ## ConfigMaps 是与 Alertmanager 对象在同一命名空间中的 ConfigMap 列表，它们将被挂载到 Alertmanager Pods 中。
    ## ConfigMap 将被挂载到 /etc/alertmanager/configmaps/。
    ##
    configMaps: []

    ## ConfigSecret 是与 Alertmanager 对象在同一命名空间中的 Kubernetes Secret 的名称，其中包含此 Alertmanager 实例的配置。
    ## 默认为 'alertmanager-'。Secret 将被挂载到 /etc/alertmanager/config。
    ##
    # configSecret:

    ## WebTLSConfig 定义 HTTPS 的 TLS 参数
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#alertmanagerwebspec
    web: {}

    ## 要选择的 AlertmanagerConfig，用于合并和配置 Alertmanager。
    ##
    alertmanagerConfigSelector: {}
    ## 示例，选择所有带有 "alertconfig" 标签且值为 "example-config" 或 "example-config-2" 的 alertmanagerConfig 资源
    # alertmanagerConfigSelector:
    #   matchExpressions:
    #     - key: alertconfig
    #       operator: In
    #       values:
    #         - example-config
    #         - example-config-2
    #
    ## 示例，选择所有带有 "role" 标签且值为 "example-config" 的 alertmanagerConfig 资源
    # alertmanagerConfigSelector:
    #   matchLabels:
    #     role: example-config

    ## 要选择的 AlertmanagerConfig 发现的命名空间。如果为 nil，则只检查自己的命名空间。
    ##
    alertmanagerConfigNamespaceSelector: {}
    ## 示例，选择所有带有 "alertmanagerconfig" 标签且值为 "example-namespace" 或 "example-namespace-2" 的命名空间
    # alertmanagerConfigNamespaceSelector:
    #   matchExpressions:
    #     - key: alertmanagerconfig
    #       operator: In
    #       values:
    #         - example-namespace
    #         - example-namespace-2

    ## 示例，选择所有带有 "alertmanagerconfig" 标签且值为 "enabled" 的命名空间
    # alertmanagerConfigNamespaceSelector:
    #   matchLabels:
    #     alertmanagerconfig: enabled

    ## 用作顶级配置的 AlertmanagerConfig
    ##
    alertmanagerConfiguration: {}
    ## 示例，选择一个全局 alertmanagerconfig
    # alertmanagerConfiguration:
    #   name: global-alertmanager-Configuration

    ## 定义 AlertmanagerConfig 对象匹配警报时使用的策略。例如：
    ##
    alertmanagerConfigMatcherStrategy: {}
    ## 示例，使用 OnNamespace 策略
    # alertmanagerConfigMatcherStrategy:
    #   type: OnNamespace

    ## 传递给 Alertmanager 的额外命令行参数（除了图表生成的参数之外）
    additionalArgs: []
## 定义日志格式
# 使用 logfmt (默认) 或 json 日志记录
logFormat: logfmt

## Alertmanager 的日志级别配置
##
logLevel: info

## 预期中的 Alertmanager 集群大小。控制器最终将使运行中的集群大小等于预期大小。
replicas: 1

## Alertmanager 应该保留数据的时间。默认值为 '120h'，必须匹配正则表达式
## [0-9]+(ms|s|m|h) (毫秒 秒 分钟 小时)。
##
retention: 120h

## 存储是 Alertmanager 实例将如何使用存储的定义。
## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/platform/storage.md
##
storage: {}
# volumeClaimTemplate:
#   spec:
#     storageClassName: gluster
#     accessModes: ["ReadWriteOnce"]
#     resources:
#       requests:
#         storage: 50Gi
#     selector: {}


## Alertmanager 实例可用的外部 URL。这是生成正确 URL 所必需的。如果 Alertmanager 不是从 DNS 名称的根目录提供的，则这是必需的。string  false
##
externalUrl:

## Alertmanager 注册 HTTP 处理程序的路由前缀。这很有用，如果使用 ExternalURL 并且代理正在重写请求的 HTTP 路由，并且实际的 ExternalURL 仍然为真，
## 但服务器在不同的路由前缀下提供请求。例如，用于 kubectl 代理。
##
routePrefix: /

## scheme: 要使用的 HTTP scheme。例如，如果使用 istio mTLS，可以与 `tlsConfig` 一起使用。
scheme: ""

## tlsConfig: 连接到端点时要使用的 TLS 配置。例如，如果使用 istio mTLS。
## 类型: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#tlsconfig
tlsConfig: {}

## 如果设置为 true，则不会执行对底层托管对象的所有操作，除了删除操作。
##
paused: false

## 定义 Pods 调度到哪些节点。
## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
##
nodeSelector: {}

## 定义单个 Pods 的资源请求和限制。
## 参考: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
##
resources: {}
# requests:
#   memory: 400Mi

## Pod 反亲和性可以防止调度器将 Prometheus 副本放置在同一个节点上。
## 默认值 "soft" 意味着调度器*倾向于*不将两个副本 Pods 调度到同一个节点上，但不提供保证。
## 值 "hard" 意味着调度器*必须*不将两个副本 Pods 调度到同一个节点上。
## 值 "" 将禁用 Pod 反亲和性，因此不会配置反亲和性规则。
##
podAntiAffinity: "soft"

## 如果启用反亲和性，设置用于反亲和性的 topologyKey。
## 这可以更改为，例如，failure-domain.beta.kubernetes.io/zone
##
podAntiAffinityTopologyKey: kubernetes.io/hostname

## 为 alertmanager 实例分配自定义亲和性规则
## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
##
affinity: {}
# nodeAffinity:
#   requiredDuringSchedulingIgnoredDuringExecution:
#     nodeSelectorTerms:
#     - matchExpressions:
#       - key: kubernetes.io/e2e-az-name
#         operator: In
#         values:
#         - e2e-az1
#         - e2e-az2

## 如果指定，Pod 的容忍度。
## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
##
tolerations: []
# - key: "key"
#   operator: "Equal"
#   value: "value"
#   effect: "NoSchedule"

## 如果指定，Pod 的拓扑扩展约束。
## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
##
topologySpreadConstraints: []
# - maxSkew: 1
#   topologyKey: topology.kubernetes.io/zone
#   whenUnsatisfiable: DoNotSchedule
#   labelSelector:
#     matchLabels:
#       app: alertmanager

## SecurityContext 包含 Pod 级别的安全属性和通用容器设置。
## 默认设置为非 root 用户，UID 为 1000，GID 为 2000。*v1.PodSecurityContext  false
## 参考: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
##
securityContext:
  runAsGroup: 2000
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

## ListenLocal 使 Alertmanager 服务器在 loopback 上监听，这样它就不会绑定到 Pod IP。
## 注意，这仅适用于 Alertmanager UI，不适用于 gossip 通信。
##
listenLocal: false

## Containers 允许注入额外的容器。这是为了允许向 Alertmanager Pod 添加身份验证代理。
##
containers: []
# containers:
# - name: oauth-proxy
#   image: quay.io/oauth2-proxy/oauth2-proxy:v7.10.0
#   args:
#   - --upstream=http://127.0.0.1:9093
#   - --http-address=0.0.0.0:8081
#   - --metrics-address=0.0.0.0:8082
#   - ...
#   ports:
#   - containerPort: 8081
#     name: oauth-proxy
#     protocol: TCP
#   - containerPort: 8082
#     name: oauth-metrics
#     protocol: TCP
#   resources: {}

# 输出 StatefulSet 定义中的额外卷。
volumes: []

# 输出 StatefulSet 定义中的额外 VolumeMounts。
volumeMounts: []

## InitContainers 允许注入额外的 initContainers。这是为了在启动 prometheus 之前对挂载的卷进行一些更改（权限，目录树）。
initContainers: []

## 分配给 Pods 的优先级类
##
priorityClassName: ""

## AdditionalPeers 允许注入一组额外的 Alertmanager，以形成高可用性集群。
##
additionalPeers: []

## Alert Manager 使用的 PortName。
##
portName: "http-web"

## ClusterAdvertiseAddress 是在集群中明确宣传的地址。对于非 RFC1918 [1]（公共）地址需要提供。 [1] RFC1918: https://tools.ietf.org/html/rfc1918
##
clusterAdvertiseAddress: false

## clusterGossipInterval 确定 gossip 尝试之间的间隔。
## 需要指定为 GoDuration，一个可以被 Go 的 time.ParseDuration() 解析的时间持续时间（例如 45ms, 30s, 1m, 1h20m15s）
clusterGossipInterval: ""

## clusterPeerTimeout 确定集群对等超时。
## 需要指定为 GoDuration，一个可以被 Go 的 time.ParseDuration() 解析的时间持续时间（例如 45ms, 30s, 1m, 1h20m15s）
clusterPeerTimeout: ""

## clusterPushpullInterval 确定推拉尝试之间的间隔。
## 需要指定为 GoDuration，一个可以被 Go 的 time.ParseDuration() 解析的时间持续时间（例如 45ms, 30s, 1m, 1h20m15s）
clusterPushpullInterval: ""

## clusterLabel 定义唯一标识 Alertmanager 集群的标识符。
clusterLabel: ""

## ForceEnableClusterMode 确保当以单个副本运行时，Alertmanager 不会停用集群模式。
## 用例是例如在每个 Kubernetes 集群中只有一个副本的情况下，跨 Kubernetes 集群扩展 Alertmanager 集群。
forceEnableClusterMode: false

## 一个新创建的 pod 应该在没有任何容器崩溃的情况下准备好的最小秒数，以便被认为是可用的。
## 默认为 0（pod 一旦准备好就会被认为是可用的）。
minReadySeconds: 0

## 上述属性未涵盖的附加配置。（通过 tpl 传递）
additionalConfig: {}

## 上述属性未涵盖的附加配置。
## 如果您需要 alertmanagerSpec 内的高级模板，则很有用。
## 否则，请使用 alertmanager.alertmanagerSpec.additionalConfig（通过 tpl 传递）
additionalConfigString: ""

## ExtraSecret 可用于在额外 secret 中存储各种数据
## （例如，用于存储哈希过的基本 auth 凭据）
extraSecret:
  ## 如果未设置，名称将自动生成
  # name: ""
  annotations: {}
  data: {}
#   auth: |
#     foo:$apr1$OFG3Xybp$ckL0FHDAkoXYIlH9.cysT0
#     someoneelse:$apr1$DMZX2Z4q$6SbQIfyuLQd.xmo/P0m2c.

## 使用来自 https://github.com/grafana/helm-charts/blob/main/charts/grafana/values.yaml 的默认值
##
grafana:
  enabled: true
  namespaceOverride: ""

  ## ForceDeployDatasources 即使 grafana 部署已被禁用，也创建数据源 configmap
  ##
  forceDeployDatasources: false

  ## ForceDeployDashboard 即使 grafana 部署已被禁用，也创建仪表板 configmap
  ##
  forceDeployDashboards: false

  ## 部署默认仪表板
  ##
  defaultDashboardsEnabled: false

  ## 当使用 grafana-operator 时，部署引用 ConfigMaps 中仪表板的 GrafanaDashboard CRD
  ## 这些设置控制仪表板如何与 Grafana Operator 集成
  ## 注意: 最终用户仍然需要为 Prometheus 创建自己的 kind: GrafanaDataSource
  ## 例如:
  ## apiVersion: grafana.integreatly.org/v1beta1
  ## kind: GrafanaDatasource
  ## metadata:
  ##   name: prometheus
  ##   annotations: {}
  ## spec:
  ##   allowCrossNamespaceImport: true
  ##   instanceSelector:
  ##     matchLabels:
  ##       app: grafana
  ##   datasource:
  ##     name: prometheus
  ##     type: prometheus
  ##     access: proxy
  ##     url: http://prometheus-operated.prometheus-stack.svc.cluster.local:9090
  ##     isDefault: true
  ##     jsonData:
  ##       "tlsSkipVerify": true
  ##       "timeInterval": "5s"
  ##
  operator:
    ## 启用对包含仪表板的 ConfigMaps 的引用，在 GrafanaDashboard CR 中
    ## 设置为 true 以允许从 ConfigMap 引用加载仪表板
    dashboardsConfigMapRefEnabled: false

    ## GrafanaDashboard Cr 的注解
    ##
    annotations: {}
    ## 应匹配的 kind: Grafana 实例的标签
    ## 示例: { app: grafana, category: dashboard }
    ##
    matchLabels: {}

    ## 操作员应多久重新同步一次资源（持续时间格式）
    ## 控制操作员协调仪表板的频率
    ##
    resyncPeriod: 10m

    ## Grafana 中所有仪表板的文件夹。General 意味着在根级别
    ##
    folder: General

  ## 默认仪表板的时区
  ## 其他选项: browser 或一个特定的时区，例如 Europe/Luxembourg
  ##
  defaultDashboardsTimezone: cst

  ## 默认仪表板的可编辑标志
  ##
  defaultDashboardsEditable: true

  ## Grafana 仪表板的默认间隔
  ##
  defaultDashboardsInterval: 1m

  adminUser: admin
  adminPassword: prom-operator

  rbac:
    ## 如果为 true，将创建 Grafana PSP
    ##
    pspEnabled: false

  ingress:
    ## 如果为 true，将创建 Grafana Ingress
    ##
    enabled: false

    ## Grafana Ingress 的 IngressClassName。
    ## 如果启用 Ingress，则应提供。
    ##
    # ingressClassName: nginx

    ## Grafana Ingress 的注解
    ##
    annotations: {}
      # kubernetes.io/ingress.class: nginx
      # kubernetes.io/tls-acme: "true"

    ## 要添加到 Ingress 的标签
    ##
    labels: {}

    ## 主机名。
    ## 如果启用 Ingress，则必须提供。
    ##
    # hosts:
    #   - grafana.domain.com
    hosts: []

    ## grafana ingress 的路径
    path: /

    ## grafana Ingress 的 TLS 配置
    ## Secret 必须在命名空间中手动创建
    ##
    tls: []
    # - secretName: grafana-general-tls
    #   hosts:
    #   - grafana.example.com

  # # 使 Grafana 持久化（使用 Statefulset）
  # #
  # persistence:
  #   enabled: true
  #   type: sts
  #   storageClassName: "storageClassName"
  #   accessModes:
  #     - ReadWriteOnce
  #   size: 20Gi
  #   finalizers:
  #     - kubernetes.io/pvc-protection

  serviceAccount:
    create: true
    autoMount: true

  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      # 允许在所有命名空间中发现仪表板
      searchNamespace: ALL

      # 支持新的表格面板，启用后，grafana 会自动将旧的表格面板迁移到新的表格面板
      enableNewTablePanelSyntax: false

      folder: /tmp/dashboards
      folderAnnotation: k8s-sidecar-target-directory

      ## Grafana 仪表板 configmaps 的注解
      ##
      annotations: {}
      multicluster:
        global:
          enabled: false
        etcd:
          enabled: false
      provider:
        allowUiUpdates: false
        foldersFromFilesStructure: true
    datasources:
      enabled: true
      defaultDatasourceEnabled: true
      isDefaultDatasource: false

      name: Prometheus
      uid: prometheus

      ## prometheus 数据源的 URL
      ##
      url: http://kube-prom-stack-prometheus.observe.svc.cluster.local:9090

      ## Prometheus 请求超时时间（秒）
      # timeout: 30

      # 如果未定义，将使用 prometheus.prometheusSpec.scrapeInterval 或其默认值
      # defaultDatasourceScrapeInterval: 15s

      ## Grafana 数据源 configmaps 的注解
      ##
      annotations: {}

      ## 用于向数据源发送查询的 HTTP 方法
      httpMethod: POST

      ## 为每个 Prometheus StatefulSet 的 Pod 创建数据源；
      ## 这默认使用由 Prometheus Operator 创建的无头服务 `prometheus-operated`。
      ## 如果您为 Prometheus 实例部署了自己的服务，可以使用 `prometheusServiceName` 字段指定它
      ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/0fee93e12dc7c2ea1218f19ae25ec6b893460590/pkg/prometheus/statefulset.go#L255-L286
      createPrometheusReplicasDatasources: false
      prometheusServiceName: prometheus-operated
      label: grafana_datasource
      labelValue: "1"

      ## 指向 Grafana 中现有数据源的内部链接字段。
      ## 可以通过 additionalDataSources 进行配置
      exemplarTraceIdDestinations: {}
        # datasourceUid: Jaeger
        # traceIdLabelName: trace_id
        # urlDisplayLabel: View traces
      alertmanager:
        enabled: true
        name: Alertmanager
        uid: alertmanager
        handleGrafanaManagedAlerts: false
        implementation: prometheus

  extraConfigmapMounts: []
  # - name: certs-configmap
  #   mountPath: /etc/grafana/ssl/
  #   configMap: certs-configmap
  #   readOnly: true

  deleteDatasources: []
  # - name: example-datasource
  #   orgId: 1

  ## 配置附加的 grafana 数据源（通过 tpl 传递）
  ## 参考: https://grafana.com/docs/grafana/latest/administration/provisioning/#datasources
  additionalDataSources: 
  # - name: prometheus-sample
  #   access: proxy
  #   basicAuth: true
  #   secureJsonData:
  #       basicAuthPassword: pass
  #   basicAuthUser: daco
  #   editable: false
  #   jsonData:
  #       tlsSkipVerify: true
  #   orgId: 1
  #   type: prometheus
  #   url: https://{{ printf "%s-prometheus.svc" .Release.Name }}:9090
  #   version: 1
    - name: Loki
      type: loki
      uid: loki
      access: proxy
      url: http://loki-distributed-gateway.observe.svc.cluster.local
      isDefault: false
      editable: false
      jsonData:
        httpHeaderName1: "X-Scope-OrgID"
      secureJsonData:
        httpHeaderValue1: "fake"   # tenant 名称
    - name: Jaeger
      type: jaeger
      url: http://jaeger-query.observe:16686
      access: proxy
      isDefault: false
  # 标记已配置的数据源，如果不再配置，则进行删除。
  # 如果数据源已在 deleteDatasources 部分列出，则无效。
  # 参考: https://grafana.com/docs/grafana/latest/administration/provisioning/#example-data-source-configuration-file
  prune: false

  ## 传递给 grafana 子图表并由下面的 servicemonitor 使用
  ##
  service:
    portName: http-web
    ipFamilies: []
    ipFamilyPolicy: ""

  serviceMonitor:
    # 如果为 true，则为 prometheus operator 创建 ServiceMonitor CRD
    # https://github.com/prometheus-operator/prometheus-operator
    #
    enabled: true

    # 用于抓取指标的路径。如果 grafana.ini 中设置了 server.root_url，则可能不同
    #
    path: "/metrics"

    #  namespace: monitoring  (默认为部署此图表的命名空间)

    # ServiceMonitor 的标签
    labels: {}

    # 抓取间隔。如果未设置，则使用 Prometheus 默认抓取间隔。
    #
    interval: ""
    scheme: http
    tlsConfig: {}
    scrapeTimeout: 30s

    ## 应用于抓取前样本的 RelabelConfigs
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    relabelings: []
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace

## 禁用所有 kubernetes 组件抓取器的标志
##
kubernetesServiceMonitors:
  enabled: true

## 抓取 kube api 服务器的组件
##
kubeApiServer:
  enabled: true
  tlsConfig:
    serverName: kubernetes
    insecureSkipVerify: false
  serviceMonitor:
    enabled: true
    ## 抓取间隔。如果未设置，则使用 Prometheus 默认抓取间隔。
    ##
    interval: ""

    ## SampleLimit 定义每个抓取接受的抓取样本数量限制。
    ##
    sampleLimit: 0

    ## TargetLimit 定义接受的抓取目标数量限制。
    ##
    targetLimit: 0

    ## 每个抓取接受的样本标签数量限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelLimit: 0

    ## 每个抓取接受的样本标签名称长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelNameLengthLimit: 0

    ## 每个抓取接受的样本标签值长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelValueLengthLimit: 0

    ## proxyUrl: 应用于抓取的代理 URL。
    ##
    proxyUrl: ""

    jobLabel: component
    selector:
      matchLabels:
        component: apiserver
        provider: kubernetes

    ## 应用于抓取后、摄取前样本的 MetricRelabelConfigs。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    metricRelabelings:
      # 删除过度嘈杂的 apiserver buckets。
      - action: drop
        regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
        sourceLabels:
          - __name__
          - le
    # - action: keep
    #   regex: 'kube_(daemonset|deployment|pod|namespace|node|statefulset).+'
    #   sourceLabels: [__name__]

    ## 应用于抓取前样本的 RelabelConfigs
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    relabelings: []
    # - sourceLabels:
    #     - __meta_kubernetes_namespace
    #     - __meta_kubernetes_service_name
    #     - __meta_kubernetes_endpoint_port_name
    #   action: keep
    #   regex: default;kubernetes;https
    # - targetLabel: __address__
    #   replacement: kubernetes.default.svc:443

    ## 附加标签
    ##
    additionalLabels: {}
    #  foo: bar

    ## 定义从关联的 Kubernetes Service 对象转移到摄取指标上的标签。
    ## https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#servicemonitor
    targetLabels: []

## 抓取 kubelet 和 kubelet 托管的 cAdvisor 的组件
##
kubelet:
  enabled: true
  namespace: kube-system

  serviceMonitor:
    enabled: true
    ## 启用从 kubelet 的服务抓取 /metrics
    kubelet: true

    ## 将元数据附加到发现的目标。需要 Prometheus v2.45，用于由操作员创建的端点。
    ##
    attachMetadata:
      node: false

    ## 抓取间隔。如果未设置，则使用 Prometheus 默认抓取间隔。
    ##
    interval: ""

    ## 如果为 true，Prometheus 使用（尊重）导出器提供的标签。
    ##
    honorLabels: true

    ## 如果为 true，Prometheus 摄取带有导出器提供的显式时间戳的指标。如果为 false，Prometheus 摄取带有抓取时间戳的指标。
    ##
    honorTimestamps: true

    ## 如果为 true，定义 Prometheus 是否跟踪抓取数据中包含显式时间戳的指标的陈旧性。如果 `honorTimestamps` 为 false，则无效。
    ## 如果您想要从 cadvisor 抓取的 container_ 指标获得最佳精度，我们建议启用此功能。
    ## 更多细节请参阅: https://github.com/prometheus-community/helm-charts/pull/5063#issuecomment-2545374849
    trackTimestampsStaleness: true

    ## SampleLimit 定义每个抓取接受的抓取样本数量限制。
    ##
    sampleLimit: 0

    ## TargetLimit 定义接受的抓取目标数量限制。
    ##
    targetLimit: 0

    ## 每个抓取接受的样本标签数量限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelLimit: 0

    ## 每个抓取接受的样本标签名称长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelNameLengthLimit: 0

    ## 每个抓取接受的样本标签值长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelValueLengthLimit: 0

    ## proxyUrl: 应用于抓取的代理 URL。
    ##
    proxyUrl: ""

    ## 启用通过 https 抓取 kubelet。要启用此功能，请参阅
    ## https://github.com/prometheus-operator/prometheus-operator/issues/926 的要求
    ##
    https: true

    ## 抓取时跳过 TLS 证书验证。
    ## 这默认启用，因为 kubeadm 部署的 kubelet 服务证书默认是自签名。
    ## 参考: https://kubernetes.io/docs/tasks/administer-cluster/kubeadm/kubeadm-certs/#kubelet-serving-certs
    ##
    insecureSkipVerify: true

    ## 启用从 kubelet 的服务抓取 /metrics/probes
    ##
    probes: true

    ## 启用从 kubelet 的服务抓取 /metrics/resource
    ## 默认禁用，因为容器指标已经由 cAdvisor 公开
    ##
    resource: false
    # 从 kubernetes 1.18 开始，/metrics/resource/v1alpha1 重命名为 /metrics/resource
    resourcePath: "/metrics/resource/v1alpha1"
    ## 配置资源指标的抓取间隔。此值配置为默认 Kubelet cAdvisor
    ## 最小内务间隔，以避免丢失样本。注意，如果 kubelet.serviceMonitor.interval 不为空，则此值被忽略。
    resourceInterval: 10s

    ## 启用从 kubelet 的服务抓取 /metrics/cadvisor
    ##
    cAdvisor: true
    ## 配置 cAdvisor 的抓取间隔。此值配置为默认 Kubelet cAdvisor
    ## 最小内务间隔，以避免丢失样本。注意，如果 kubelet.serviceMonitor.interval 不为空，则此值被忽略。
    cAdvisorInterval: 10s
    ## 应用于抓取后、摄取前样本的 MetricRelabelConfigs。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    cAdvisorMetricRelabelings:
      # 删除不太有用的容器 CPU 指标。
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_cpu_(cfs_throttled_seconds_total|load_average_10s|system_seconds_total|user_seconds_total)'
      # 删除不太有用的 / 总是为零的容器文件系统指标。
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_fs_(io_current|io_time_seconds_total|io_time_weighted_seconds_total|reads_merged_total|sector_reads_total|sector_writes_total|writes_merged_total)'
      # 删除不太有用的 / 总是为零的容器内存指标。
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_memory_(mapped_file|swap)'
      # 删除不太有用的容器进程指标。
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_(file_descriptors|tasks_state|threads_max)'
      # 删除 container_memory_failures_total{scope="hierarchy"} 指标，
      # 我们只需要容器范围。
      - sourceLabels: [__name__, scope]
        action: drop
        regex: 'container_memory_failures_total;hierarchy'
      # 删除与各种接口匹配的 container_network_... 指标，
      # 这些接口对应于 CNI 和类似接口。这避免了为 host network 容器捕获网络指标。
      - sourceLabels: [__name__, interface]
        action: drop
        regex: 'container_network_.*;(cali|cilium|cni|lxc|nodelocaldns|tunl).*'
      # 删除与 kube-state-metrics 重叠的容器 spec 指标。
      - sourceLabels: [__name__]
        action: drop
        regex: 'container_spec.*'
      # 删除没有 pod 的 cgroup 指标。
      - sourceLabels: [id, pod]
        action: drop
        regex: '.+;'
    # - sourceLabels: [__name__, image]
    #   separator: ;
    #   regex: container_([a-z_]+);
    #   replacement: $1
    #   action: drop
    # - sourceLabels: [__name__]
    #   separator: ;
    #   regex: container_(network_tcp_usage_total|network_udp_usage_total|tasks_state|cpu_load_average_10s)
    #   replacement: $1
    #   action: drop

    ## 应用于抓取后、摄取前样本的 MetricRelabelConfigs。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    probesMetricRelabelings: []
    # - sourceLabels: [__name__, image]
    #   separator: ;
    #   regex: container_([a-z_]+);
    #   replacement: $1
    #   action: drop
    # - sourceLabels: [__name__]
    #   separator: ;
    #   regex: container_(network_tcp_usage_total|network_udp_usage_total|tasks_state|cpu_load_average_10s)
    #   replacement: $1
    #   action: drop

    ## 应用于抓取前样本的 RelabelConfigs
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    ## metrics_path 需要匹配上游规则和图表
    cAdvisorRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace

    ## 应用于抓取前样本的 RelabelConfigs
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    probesRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace

    ## 应用于抓取前样本的 RelabelConfigs
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    resourceRelabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace

    ## 应用于抓取后、摄取前样本的 MetricRelabelConfigs。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    metricRelabelings:
      # 减少 kubelet 存储操作的 bucket 基数。
      - action: drop
        sourceLabels: [__name__, le]
        regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
    # - sourceLabels: [__name__, image]
    #   separator: ;
    #   regex: container_([a-z_]+);
    #   replacement: $1
    #   action: drop
    # - sourceLabels: [__name__]
    #   separator: ;
    #   regex: container_(network_tcp_usage_total|network_udp_usage_total|tasks_state|cpu_load_average_10s)
    #   replacement: $1
    #   action: drop

    ## 应用于抓取前样本的 RelabelConfigs
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    ## metrics_path 需要匹配上游规则和图表
    relabelings:
      - action: replace
        sourceLabels: [__metrics_path__]
        targetLabel: metrics_path
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace

    ## 附加标签
    ##
    additionalLabels: {}
    #  foo: bar

    ## 定义从关联的 Kubernetes Service 对象转移到摄取指标上的标签。
    ## https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#servicemonitor
    targetLabels: []

## 抓取 kube controller manager 的组件
##
kubeControllerManager:
  enabled: true

  ## 如果您的 kube controller manager 不是作为 pod 部署的，请指定可以找到它的 IP
  ##
  endpoints: []
  # - 10.141.4.22
  # - 10.141.4.23
  # - 10.141.4.24

  ## 如果使用 kubeControllerManager.endpoints，则仅使用 port 和 targetPort
  ##
  service:
    enabled: true
    ## 如果为 null 或未设置，该值将根据目标 Kubernetes 版本动态确定，因为 Kubernetes 1.22 中的默认端口发生了变化。
    ##
    port: null
    targetPort: null
    ipDualStack:
      enabled: false
      ipFamilies: ["IPv6", "IPv4"]
      ipFamilyPolicy: "PreferDualStack"
    # selector:
    #   component: kube-controller-manager

  serviceMonitor:
    enabled: true
    ## 抓取间隔。如果未设置，则使用 Prometheus 默认抓取间隔。
    ##
    interval: ""

    ## SampleLimit 定义每个抓取接受的抓取样本数量限制。
    ##
    sampleLimit: 0

    ## TargetLimit 定义接受的抓取目标数量限制。
    ##
    targetLimit: 0

    ## 每个抓取接受的样本标签数量限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelLimit: 0

    ## 每个抓取接受的样本标签名称长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelNameLengthLimit: 0

    ## 每个抓取接受的样本标签值长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelValueLengthLimit: 0

    ## proxyUrl: 应用于抓取的代理 URL。
    ##
    proxyUrl: ""

    ## port: 将从中抓取指标的端口名称
    ##
    port: http-metrics

    jobLabel: jobLabel
    selector: {}
    #  matchLabels:
    #    component: kube-controller-manager

    ## 启用通过 https 抓取 kube-controller-manager。
    ## 需要正确的证书（非自签名）和委托的身份验证/授权检查。
    ## 如果为 null 或未设置，该值将根据目标 Kubernetes 版本动态确定。
    ##
    https: null

    # 抓取时跳过 TLS 证书验证
    insecureSkipVerify: null

    # 验证 TLS 证书时要使用的服务器名称
    serverName: null

    ## 应用于抓取后、摄取前样本的 MetricRelabelConfigs。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    metricRelabelings: []
    # - action: keep
    #   regex: 'kube_(daemonset|deployment|pod|namespace|node|statefulset).+'
    #   sourceLabels: [__name__]

    ## 应用于抓取前样本的 RelabelConfigs
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    relabelings: []
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace

    ## 附加标签
    ##
    additionalLabels: {}
    #  foo: bar

    ## 定义从关联的 Kubernetes Service 对象转移到摄取指标上的标签。
    ## https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#servicemonitor
    targetLabels: []

## 抓取 coreDns 的组件。使用这个或 kubeDns
##
coreDns:
  enabled: true
  service:
    enabled: true
    port: 9153
    targetPort: 9153

    ipDualStack:
      enabled: false
      ipFamilies: ["IPv6", "IPv4"]
      ipFamilyPolicy: "PreferDualStack"
    # selector:
