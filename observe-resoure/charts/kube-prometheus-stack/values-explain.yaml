      ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
      ##
      relabelings: []
      # - sourceLabels: [__meta_kubernetes_pod_node_name]
      #   separator: ;
      #   regex: ^(.*)$
      #   targetLabel: nodename
      #   replacement: $1
      #   action: replace

  selfMonitor:
    enabled: false

## 将 node exporter 部署为 Daemonset 到所有节点
##
nodeExporter:
  enabled: true
  operatingSystems:
    linux:
      enabled: true
    aix:
      enabled: true
    darwin:
      enabled: true

  ## forceDeployDashboard 即使禁用了 nodeExporter 部署，也创建仪表板 ConfigMap
  ##
  forceDeployDashboards: false

## prometheus-node-exporter 子图配置
##
prometheus-node-exporter:
  namespaceOverride: ""
  podLabels:
    ## 添加 'node-exporter' 标签，供 ServiceMonitor 在规则和 Grafana 仪表板中匹配标准用法
    ##
    jobLabel: node-exporter
  releaseLabel: true
  extraArgs:
    - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/kubelet/.+)($|/)
    - --collector.filesystem.fs-types-exclude=^(autofs|binfmt_misc|bpf|cgroup2?|configfs|debugfs|devpts|devtmpfs|fusectl|hugetlbfs|iso9660|mqueue|nsfs|overlay|proc|procfs|pstore|rpc_pipefs|securityfs|selinuxfs|squashfs|sysfs|tracefs|erofs)$
  service:
    portName: http-metrics
    ipDualStack:
      enabled: false
      ipFamilies: ["IPv6", "IPv4"]
      ipFamilyPolicy: "PreferDualStack"
    labels:
      jobLabel: node-exporter

  prometheus:
    monitor:
      enabled: true

      jobLabel: jobLabel

      ## 抓取间隔。如果未设置，则使用 Prometheus 默认抓取间隔。
      ##
      interval: ""

      ## sampleLimit 定义了每个抓取接受的样本数量限制。
      ##
      sampleLimit: 0

      ## targetLimit 定义了接受的抓取目标数量限制。
      ##
      targetLimit: 0

      ## 每个抓取接受的标签数量限制。仅在 Prometheus 2.27.0 及更高版本中有效。
      ##
      labelLimit: 0

      ## 每个抓取接受的标签名称长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
      ##
      labelNameLengthLimit: 0

      ## 每个抓取接受的标签值长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
      ##
      labelValueLengthLimit: 0

      ## 抓取请求超时时长。如果未设置，则使用 Prometheus 默认抓取超时。
      ##
      scrapeTimeout: ""

      ## proxyUrl: 用于抓取的代理 URL。
      ##
      proxyUrl: ""

      ## metricRelabelings：在抓取后、摄取前应用于样本的重贴标签配置。
      ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
      ##
      metricRelabelings: []
      # - sourceLabels: [__name__]
      #   separator: ;
      #   regex: ^node_mountstats_nfs_(event|operations|transport)_.+
      #   replacement: $1
      #   action: drop

      ## relabelings: 在抓取前应用于样本的重贴标签配置。
      ## ref: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
      ##
      relabelings: []
      # - sourceLabels: [__meta_kubernetes_pod_node_name]
      #   separator: ;
      #   regex: ^(.*)$
      #   targetLabel: nodename
      #   replacement: $1
      #   action: replace

      ## 将节点元数据附加到发现的目标。需要 Prometheus v2.35.0 及以上版本。
      ##
      # attachMetadata:
      #   node: false

  rbac:
    ## 如果为 true，则为 node-exporter 创建 PSP
    ##
    pspEnabled: false

    

## 管理 Prometheus 和 Alertmanager 组件
##
prometheusOperator:
  enabled: true

  ## 默认使用 '{{ template "kube-prometheus-stack.fullname" . }}-operator'
  fullnameOverride: ""

  ## 要保留的旧 ReplicaSet 数量
  ## 默认值为 10，0 将垃圾回收旧 ReplicaSet
  revisionHistoryLimit: 10

  ## 部署策略
  ##
  strategy: {}

  ## Prometheus-Operator v0.39.0 及更高版本原生支持 TLS。
  ##
  tls:
    enabled: true
    # 值必须与 https://pkg.go.dev/crypto/tls#pkg-constants 中的版本名称匹配
    tlsMinVersion: VersionTLS13
    # 默认的 webhook 端口为 10250，以便在 GKE 私有集群中即开即用，并避免添加防火墙规则。
    internalPort: 10250

  ## Prometheus Operator 部署的活跃度探测
  ##
  livenessProbe:
    enabled: true
    failureThreshold: 3
    initialDelaySeconds: 0
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
