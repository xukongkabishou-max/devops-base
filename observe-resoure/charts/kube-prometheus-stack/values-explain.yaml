  enabled: true

  ## 将 prometheus 切换到代理模式
  ## 请注意，以下许多功能（例如规则、查询、警报、远程读取、thanos）在代理模式下将无法工作。
  ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/platform/prometheus-agent.md
  ##
  agentMode: false

  ## Prometheus 的注解
  ##
  annotations: {}

  ## Prometheus 的附加标签
  ##
  additionalLabels: {}

  ## 配置 prometheus 的网络策略
  networkPolicy:
    enabled: false

    ## 使用的网络策略类型。
    #  可以是:
    #  * kubernetes for networking.k8s.io/v1/NetworkPolicy
    #  * cilium     for cilium.io/v2/CiliumNetworkPolicy
    flavor: kubernetes

    # cilium:
    #   endpointSelector:
    #   egress:
    #   ingress:

    # egress:
    # - {}
    # ingress:
    # - {}
    # podSelector:
    #   matchLabels:
    #     app: prometheus

  ## Prometheus 使用的服务账户。
  ## 参考: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  ##
  serviceAccount:
    create: true
    name: ""
    annotations: {}
    automountServiceAccountToken: true

  # 用于 sidecar 上 thanos 服务发现的服务
  # 启用此项可使 Thanos Query 使用
  # `--store=dnssrv+_grpc._tcp.${kube-prometheus-stack.fullname}-thanos-discovery.${namespace}.svc.cluster.local` 来发现
  # prometheus 节点上的 Thanos sidecar
  # (请记住修改 ${kube-prometheus-stack.fullname} 和 ${namespace}。不要只是复制粘贴！)
  thanosService:
    enabled: false
    annotations: {}
    labels: {}

    ## 表示此服务是否希望将外部流量路由到节点本地或集群范围的端点
    ##
    externalTrafficPolicy: Cluster

    ## 服务类型
    ##
    type: ClusterIP

    ## 双栈服务
    ##
    ipDualStack:
      enabled: false
      ipFamilies: ["IPv6", "IPv4"]
      ipFamilyPolicy: "PreferDualStack"

    ## gRPC 端口配置
    portName: grpc
    port: 10901
    targetPort: "grpc"

    ## HTTP 端口配置 (用于指标)
    httpPortName: http
    httpPort: 10902
    targetHttpPort: "http"

    ## 要分配的 ClusterIP
    # 默认是无头服务 ("None")
    clusterIP: "None"

    ## 如果服务类型是 NodePort，则在每个节点上暴露的端口
    ##
    nodePort: 30901
    httpNodePort: 30902

  # 用于抓取 Sidecar 指标的服务监控
  # 也需要启用 thanosService
  thanosServiceMonitor:
    enabled: false
    interval: ""

    ## 附加标签
    ##
    additionalLabels: {}

    ## scheme: 用于抓取的 HTTP 方案。例如，与 `tlsConfig` 一起使用以支持 istio mTLS。
    scheme: ""

    ## tlsConfig: 用于抓取端点时使用的 TLS 配置。例如，与 istio mTLS 一起使用。
    ## 类型: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#tlsconfig
    tlsConfig: {}

    bearerTokenFile:

    ## 在摄取前应用于样本的指标重新标记配置。
    metricRelabelings: []

    ## 在摄取前应用于样本的重新标记配置。
    relabelings: []

  # 用于外部访问 sidecar 的服务
  # 启用此项会创建一个服务，用于在集群外部暴露 thanos-sidecar。
  thanosServiceExternal:
    enabled: false
    annotations: {}
    labels: {}
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

    ## gRPC 端口配置
    portName: grpc
    port: 10901
    targetPort: "grpc"

    ## HTTP 端口配置 (用于指标)
    httpPortName: http
    httpPort: 10902
    targetHttpPort: "http"

    ## 表示此服务是否希望将外部流量路由到节点本地或集群范围的端点
    ##
    externalTrafficPolicy: Cluster

    ## 服务类型
    ##
    type: LoadBalancer

    ## 在每个节点上暴露的端口
    ##
    nodePort: 30901
    httpNodePort: 30902

  ## Prometheus 服务配置
  ##
  service:
    enabled: true
    annotations: {}
    labels: {}
    clusterIP: ""
    ipDualStack:
      enabled: false
      ipFamilies: ["IPv6", "IPv4"]
      ipFamilyPolicy: "PreferDualStack"

    ## Prometheus 服务监听的端口
    ##
    port: 9090

    ## 用于代理 extraContainer 端口
    targetPort: 9090

    ## Prometheus Reloader 监听的端口
    ##
    reloaderWebPort: 8080

    ## Prometheus 服务器服务可用的 IP 地址列表
    ## 参考: https://kubernetes.io/docs/concepts/services-networking/service/#external-ips
    ##
    externalIPs: []

    ## 在每个节点上暴露的端口
    ## 仅在 service.type 为 'NodePort' 时使用
    ##
    nodePort: 30003

    ## 负载均衡器 IP
    ## 仅在 service.type 为 "LoadBalancer" 时使用
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

    ## 表示此服务是否希望将外部流量路由到节点本地或集群范围的端点
    ##
    externalTrafficPolicy: Cluster

    ## 服务类型
    ##
    type: NodePort

    ## Prometheus 服务要打开的附加端口
    ##
    additionalPorts: []
    # additionalPorts:
    # - name: oauth-proxy
    #   port: 8081
    #   targetPort: 8081
    # - name: oauth-metrics
    #   port: 8082
    #   targetPort: 8082

    ## 即使 Pod 本身尚未就绪，所有端点也被视为“就绪”
    ## 参考: https://kubernetes.io/docs/reference/kubernetes-api/service-resources/service-v1/#ServiceSpec
    publishNotReadyAddresses: false

    ## 如果你想确保来自特定客户端的连接每次都传递到同一个 Pod
    ## 接受 'ClientIP' 或 'None'
    ##
    sessionAffinity: None

    ## 如果你想修改 ClientIP sessionAffinity 超时
    ## 如果 ServiceAffinity == "ClientIP"，值必须 >0 且 <=86400（1天）
    ##
    sessionAffinityConfig:
      clientIP:
        timeoutSeconds: 10800

  ## 为每个有状态集 Prometheus 副本创建单独服务的配置
  ##
  servicePerReplica:
    enabled: false
    annotations: {}

    ## 每个副本的 Prometheus 服务监听的端口
    ##
    port: 9090

    ## 用于代理 extraContainer 端口
    targetPort: 9090

    ## 在每个节点上暴露的端口
    ## 仅在 servicePerReplica.type 为 'NodePort' 时使用
    ##
    nodePort: 30091

    ## 负载均衡器源 IP 范围
    ## 仅在 servicePerReplica.type 为 "LoadBalancer" 时使用
    loadBalancerSourceRanges: []

    ## 表示此服务是否希望将外部流量路由到节点本地或集群范围的端点
    ##
    externalTrafficPolicy: Cluster

    ## 服务类型
    ##
    type: ClusterIP

    ## 双栈服务
    ##
    ipDualStack:
      enabled: false
      ipFamilies: ["IPv6", "IPv4"]
      ipFamilyPolicy: "PreferDualStack"

  ## 为 Prometheus 配置 pod 破坏预算
  ## 参考: https://kubernetes.io/docs/tasks/run-application/configure-pdb/#specifying-a-poddisruptionbudget
  ##
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: ""
    unhealthyPodEvictionPolicy: AlwaysAllow

  # Ingress 在集群外部暴露 thanos sidecar
  thanosIngress:
    enabled: false

    ingressClassName: ""

    annotations: {}
    labels: {}
    servicePort: 10901

    ## 在每个节点上暴露的端口
    ## 仅在 service.type 为 'NodePort' 时使用
    ##
    nodePort: 30901

    ## 如果启用 Ingress，必须提供主机名。
    ##
    hosts: []
      # - thanos-gateway.domain.com

    ## 用于 ingress 规则的路径
    ##
    paths: []
    # - /

    ## 对于 Kubernetes >= 1.18，您应该指定 pathType（决定如何匹配 Ingress 路径）
    ## 参考 https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#better-path-matching-with-path-types
    # pathType: ImplementationSpecific

    ## Thanos Ingress 的 TLS 配置
    ## 密钥必须在命名空间中手动创建
    ##
    tls: []
    # - secretName: thanos-gateway-tls
    #   hosts:
    #   - thanos-gateway.domain.com
    #

  ## ExtraSecret 可用于在额外的密钥中存储各种数据
  ## (例如，用于存储哈希过的基本认证凭据)
  extraSecret:
    ## 如果未设置，名称将自动生成
    # name: ""
    annotations: {}
    data: {}
  #   auth: |
  #     foo:$apr1$OFG3Xybp$ckL0FHDAkoXYIlH9.cysT0
  #     someoneelse:$apr1$DMZX2Z4q$6SbQIfyuLQd.xmo/P0m2c.

  ingress:
    enabled: false

    ingressClassName: ""

    annotations: {}
    labels: {}

    ## 将 ingress 重定向到服务上定义的附加端口
    # servicePort: 8081

    ## 主机名。
    ## 如果启用 Ingress，必须提供。
    ##
    # hosts:
    #   - prometheus.domain.com
    hosts: []

    ## 用于 ingress 规则的路径 - 一个路径应与 prometheusSpec.routePrefix 匹配
    ##
    paths: []
    # - /

    ## 对于 Kubernetes >= 1.18，您应该指定 pathType（决定如何匹配 Ingress 路径）
    ## 参考 https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#better-path-matching-with-path-types
    # pathType: ImplementationSpecific

    ## Prometheus Ingress 的 TLS 配置
    ## 密钥必须在命名空间中手动创建
    ##
    tls: []
      # - secretName: prometheus-general-tls
      #   hosts:
      #     - prometheus.example.com

  # -- BETA: 在此处配置图表的网关路由。
  # 可以通过添加像 'main' 路由一样的字典键来添加更多路由。
  # 请注意，这是此功能的早期 beta 版本，
  # kube-prometheus-stack 不保证其工作并可能发生变化。
  # 由于是 BETA，此功能将来可能/将会更改，恕不另行通知，除非您愿意承担风险，否则请勿使用
  # [[参考]](https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io%2fv1alpha2)
  route:
    main:
      # -- 启用或禁用路由
      enabled: false

      # -- 设置路由 apiVersion，例如 gateway.networking.k8s.io/v1 or gateway.networking.k8s.io/v1alpha2
      apiVersion: gateway.networking.k8s.io/v1
      # -- 设置路由类型
      # 有效选项为 GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
      kind: HTTPRoute

      annotations: {}
      labels: {}

      hostnames: []
      # - my-filter.example.com
      parentRefs: []
      # - name: acme-gw

      # -- 创建用于重定向的 http 路由 (https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/#http-to-https-redirects)
      ## 请注意，仅在网关的 http 监听器上启用此功能，以避免无限重定向。
      ## 如果此项设置为 true，matches、filters 和 additionalRules 将被忽略。
      httpsRedirect: false

      matches:
        - path:
            type: PathPrefix
            value: /

      ## 过滤器定义应用于与此规则匹配的请求的过滤器。
      filters: []

      ## 可添加到路由的附加自定义规则
      additionalRules: []

  ## 配置创建将映射到每个 Prometheus 副本服务的 Ingress
  ## 必须启用 prometheus.servicePerReplica
  ##
  ingressPerReplica:
    enabled: false

    ingressClassName: ""

    annotations: {}
    labels: {}

    ## 每个副本 ingress 的最终主机名形式为
    ## {{ ingressPerReplica.hostPrefix }}-{{ $replicaNumber }}.{{ ingressPerReplica.hostDomain }}
    ##
    ## 每个副本 ingress 的前缀，末尾将附加 `-$replicaNumber`
    hostPrefix: ""
    ## 将用于每个副本 ingress 的域
    hostDomain: ""

    ## 用于 ingress 规则的路径
    ##
    paths: []
    # - /

    ## 对于 Kubernetes >= 1.18，您应该指定 pathType（决定如何匹配 Ingress 路径）
    ## 参考 https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#better-path-matching-with-path-types
    # pathType: ImplementationSpecific

    ## 包含 Prometheus 每个副本 ingress 的 TLS 证书的密钥名称
    ## 密钥必须在命名空间中手动创建
    tlsSecretName: ""

    ## 为每个副本 Ingress 分离的密钥。可与 cert-manager 一起使用
    ##
    tlsSecretPerReplica:
      enabled: false
      ## 每个副本 ingress 的最终密钥形式为
      ## {{ tlsSecretPerReplica.prefix }}-{{ $replicaNumber }}
      ##
      prefix: "prometheus"

  serviceMonitor:
    ## 如果为 true，则为 prometheus 创建一个 serviceMonitor
    ##
    selfMonitor: true

    ## 抓取间隔。如果未设置，则使用 Prometheus 默认的抓取间隔。
    ##
    interval: ""

    ## 附加标签
    ##
    additionalLabels: {}

    ## SampleLimit 定义了每个抓取可接受的样本数的限制。
    ##
    sampleLimit: 0

    ## TargetLimit 定义了可接受的抓取目标数的限制。
    ##
    targetLimit: 0

    ## 每个抓取可接受的标签数的限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelLimit: 0

    ## 每个抓取可接受的标签名长度的限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelNameLengthLimit: 0

    ## 每个抓取可接受的标签值长度的限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelValueLengthLimit: 0

    ## scheme: 用于抓取的 HTTP 方案。例如，与 `tlsConfig` 一起使用以支持 istio mTLS。
    scheme: ""

    ## tlsConfig: 用于抓取端点时使用的 TLS 配置。例如，与 istio mTLS 一起使用。
    ## 类型: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#tlsconfig
    tlsConfig: {}

    bearerTokenFile:

    ## 在摄取前应用于样本的指标重新标记配置。
    ##
    metricRelabelings: []
    # - action: keep
    #   regex: 'kube_(daemonset|deployment|pod|namespace|node|statefulset).+'
    #   sourceLabels: [__name__]

    #   在摄取前应用于样本的重新标记配置。
    ##
    relabelings: []
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace

    ## 附加端点
    ##
    additionalEndpoints: []
    # - port: oauth-metrics
    #   path: /metrics

  ## 影响 prometheusSpec 的设置
  ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#prometheusspec
  ##
  prometheusSpec:
    ## 有状态集的持久卷声明保留策略
    ## whenDeleted 和 whenScaled 决定了
    ## 有状态集在缩减和删除时
    ## 是否删除（true）或保留（false）PVC。
    ## 需要 Kubernetes 1.27.0+ 版本。
    ## 参考: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
    persistentVolumeClaimRetentionPolicy: {}
    #  whenDeleted: Retain
    #  whenScaled: Retain

    ## 如果为 true，则向 prometheus 传递 --storage.tsdb.max-block-duration=2h。如果使用 Thanos，此操作已完成。
    ##
    disableCompaction: false

    ## AutomountServiceAccountToken 指示是否应自动将服务账户令牌挂载到 Pod 中，
    ## 如果未设置该字段，operator 默认会挂载服务账户令牌。
    ## 警告: 请注意，默认情况下，Prometheus 需要服务账户令牌才能进行 Kubernetes 服务发现，
    ## 可以使用战略合并补丁将服务账户令牌投影到 'prometheus' 容器中。
    automountServiceAccountToken: true

    ## APIServerConfig
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#apiserverconfig
    ##
    apiserverConfig: {}

    ## 允许为 Prometheus 容器设置附加参数
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#monitoring.coreos.com/v1.Prometheus
    additionalArgs: []

    ## 抓取失败日志文件。
    ## 重新加载配置将重新打开文件。
    ## 默认为空（禁用）
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#monitoring.coreos.com/v1.Prometheus
    ##
    scrapeFailureLogFile: ""

    ## 连续抓取之间的间隔。
    ## 默认为 30s。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/release-0.44/pkg/prometheus/promcfg.go#L180-L183
    ##
    scrapeInterval: ""

    ## 在出错前等待目标响应的秒数
    ##
    scrapeTimeout: ""

    ## 暴露给 PodMonitors、ServiceMonitors、Probes 和 ScrapeConfigs 等抓取对象的抓取类列表。
    ##
    scrapeClasses: []
    # - name: istio-mtls
    #   default: false
    #   tlsConfig:
    #     caFile: /etc/prometheus/secrets/istio.default/root-cert.pem
    #     certFile: /etc/prometheus/secrets/istio.default/cert-chain.pem

    ## PodTargetLabels 被附加到所有 PodMonitor 和 ServiceMonitor 对象的 `spec.podTargetLabels` 字段。
    ##
    podTargetLabels: []
    # - customlabel

    ## 连续评估之间的间隔。
    ##
    evaluationInterval: ""

    ## ListenLocal 使 Prometheus 服务器在回环上监听，这样它就不会绑定到 Pod IP。
    ##
    listenLocal: false

    ## enableOTLPReceiver 启用 Prometheus 的 OTLP 接收器。
    enableOTLPReceiver: false

    ## EnableAdminAPI 启用 Prometheus 的管理 HTTP API，其中包括删除时间序列等功能。
    ## 此功能默认禁用。
    ## 参考: https://prometheus.io/docs/prometheus/latest/querying/api/#tsdb-admin-apis
    ##
    enableAdminAPI: false

    ## 设置 Prometheus 版本，覆盖从镜像标签派生的版本。
    ## 在标签不遵循 semver v2 的情况下很有用。
    version: ""

    ## WebTLSConfig 定义 HTTPS 的 TLS 参数
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#webtlsconfig
    web: {}

    ## 与示例相关的设置，可在运行时重新加载。
    ## 它需要启用 exemplar storage 功能才能生效。
    exemplars: {}
      ## 所有序列存储在内存中的最大示例数。
      ## 如果未设置，Prometheus 使用其默认值。
      ## 值为零或小于零会禁用存储。
      # maxSize: 100000

    # EnableFeatures API 启用对 Prometheus 禁用功能的访问。
    # 参考: https://prometheus.io/docs/prometheus/latest/feature_flags/
    enableFeatures: []
    # - exemplar-storage

    ## https://prometheus.io/docs/guides/opentelemetry
    ##
    otlp: {}
      # promoteResourceAttributes: []
      # keepIdentifyingResourceAttributes: false
      # translationStrategy: NoUTF8EscapingWithSuffixes
      # convertHistogramsToNHCB: false

    ##
    serviceName:

    ## Prometheus 的镜像。
    ##
    image:
      registry: quay.io
      repository: prometheus/prometheus
      tag: v3.5.0
      sha: ""
      pullPolicy: IfNotPresent

    ## 用于节点污点的容忍度
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
    ##
    tolerations: []
    #  - key: "key"
    #    operator: "Equal"
    #    value: "value"
    #    effect: "NoSchedule"

    ## 如果指定，Pod 的拓扑扩展约束。
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
    ##
    topologySpreadConstraints: []
    # - maxSkew: 1
    #   topologyKey: topology.kubernetes.io/zone
    #   whenUnsatisfiable: DoNotSchedule
    #   labelSelector:
    #     matchLabels:
    #       app: prometheus

    ## 发送警报的 Alertmanagers
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#alertmanagerendpoints
    ##
    ## 默认配置将连接到作为此版本一部分部署的 alertmanager
    ##
    alertingEndpoints: []
    # - name: ""
    #   namespace: ""
    #   port: http
    #   scheme: http
    #   pathPrefix: ""
    #   tlsConfig: {}
    #   bearerTokenFile: ""
    #   apiVersion: v2

    ## 在与外部系统通信时添加到任何时间序列或警报的外部标签
    ##
    externalLabels: {}

    ## 在 prometheus-server 上启用 --web.enable-remote-write-receiver 标志
    ##
    enableRemoteWriteReceiver: false

    ## 用于表示副本名称的外部标签名称
    ##
    replicaExternalLabelName: ""

    ## 如果为 true，Operator 将不会添加用于表示副本名称的外部标签
    ##
    replicaExternalLabelNameClear: false

    ## 用于表示 Prometheus 实例名称的外部标签名称
    ##
    prometheusExternalLabelName: ""

    ## 如果为 true，Operator 将不会添加用于表示 Prometheus 实例名称的外部标签
    ##
    prometheusExternalLabelNameClear: false

    ## Prometheus 可访问的外部 URL。
    ##
    externalUrl: ""

    ## 定义 Pod 调度到的节点。
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
    ##
    nodeSelector: {}

    ## Secrets 是与 Prometheus 对象位于同一命名空间中的 Secrets 列表，它们将被挂载到 Prometheus Pod 中。
    ## Secrets 被挂载到 /etc/prometheus/secrets/。Prometheus 对象创建后对 Secrets 的更改不会
    ## 反映在正在运行的 Pod 中。要更改挂载到 Prometheus Pod 中的 secrets，必须删除并使用新的 secrets 列表重新创建该对象。
    ##
    secrets: []

    ## ConfigMaps 是与 Prometheus 对象位于同一命名空间中的 ConfigMaps 列表，它们将被挂载到 Prometheus Pod 中。
    ## ConfigMaps 被挂载到 /etc/prometheus/configmaps/。
    ##
    configMaps: []

    ## QuerySpec 定义了启动 Prometheus 时查询的命令行标志。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#queryspec
    ##
    query: {}

    ## 如果为 nil，则选择自己的命名空间。选择用于 PrometheusRules 发现的命名空间。
    ruleNamespaceSelector: {}
    ## 示例：选择命名空间中带有标签 "prometheus" 且值为 "somelabel" 的 PrometheusRules
    # ruleNamespaceSelector:
    #   matchLabels:
    #     prometheus: somelabel

    ## 如果为 true，prometheus.prometheusSpec.ruleSelector 的 nil 或 {} 值将导致
    ## 基于 helm 部署中的值创建 prometheus 资源的选择器，
    ## 这也将匹配创建的 PrometheusRule 资源
    ##
    ruleSelectorNilUsesHelmValues: true

    ## 选择用于目标发现的 PrometheusRules。
    ## 如果为 {}，则选择所有 PrometheusRules
    ##
    ruleSelector: {}
    ## 示例：选择所有带有标签 "prometheus" 且值为 "example-rules" 或 "example-rules-2" 的 PrometheusRules 资源
    # ruleSelector:
    #   matchExpressions:
    #     - key: prometheus
    #       operator: In
    #       values:
    #         - example-rules
    #         - example-rules-2
    #
    ## 示例：选择所有带有标签 "role" 且值为 "example-rules" 的 PrometheusRules 资源
    # ruleSelector:
    #   matchLabels:
    #     role: example-rules

    ## 如果为 true，prometheus.prometheusSpec.serviceMonitorSelector 的 nil 或 {} 值将导致
    ## 基于 helm 部署中的值创建 prometheus 资源的选择器，
    ## 这也将匹配创建的服务监控器
    ##
    serviceMonitorSelectorNilUsesHelmValues: true

    ## 选择用于目标发现的 ServiceMonitors。
    ## 如果为 {}，则选择所有 ServiceMonitors
    ##
    serviceMonitorSelector: {}
    ## 示例：选择带有标签 "prometheus" 且值为 "somelabel" 的 ServiceMonitors
    # serviceMonitorSelector:
    #   matchLabels:
    #     prometheus: somelabel

    ## 选择用于 ServiceMonitor 发现的命名空间。
    ##
    serviceMonitorNamespaceSelector: {}
    ## 示例：选择命名空间中带有标签 "prometheus" 且值为 "somelabel" 的 ServiceMonitors
    # serviceMonitorNamespaceSelector:
    #   matchLabels:
    #     prometheus: somelabel

    ## 如果为 true，prometheus.prometheusSpec.podMonitorSelector 的 nil 或 {} 值将导致
    ## 基于 helm 部署中的值创建 prometheus 资源的选择器，
    ## 这也将匹配创建的 pod 监控器
    ##
    podMonitorSelectorNilUsesHelmValues: true

    ## 选择用于目标发现的 PodMonitors。
    ## 如果为 {}，则选择所有 PodMonitors
    ##
    podMonitorSelector: {}
    ## 示例：选择带有标签 "prometheus" 且值为 "somelabel" 的 PodMonitors
    # podMonitorSelector:
    #   matchLabels:
    #     prometheus: somelabel

    ## 如果为 nil，则选择自己的命名空间。选择用于 PodMonitor 发现的命名空间。
    podMonitorNamespaceSelector: {}
    ## 示例：选择命名空间中带有标签 "prometheus" 且值为 "somelabel" 的 PodMonitor
    # podMonitorNamespaceSelector:
    #   matchLabels:
    #     prometheus: somelabel

    ## 如果为 true，prometheus.prometheusSpec.probeSelector 的 nil 或 {} 值将导致
    ## 基于 helm 部署中的值创建 prometheus 资源的选择器，
    ## 这也将匹配创建的探针
    ##
    probeSelectorNilUsesHelmValues: true

    ## 选择用于目标发现的 Probes。
    ## 如果为 {}，则选择所有 Probes
    ##
    probeSelector: {}
    ## 示例：选择带有标签 "prometheus" 且值为 "somelabel" 的 Probes
    # probeSelector:
    #   matchLabels:
    #     prometheus: somelabel

    ## 如果为 nil，则选择自己的命名空间。选择用于 Probe 发现的命名空间。
    probeNamespaceSelector: {}
    ## 示例：选择命名空间中带有标签 "prometheus" 且值为 "somelabel" 的 Probe
    # probeNamespaceSelector:
    #   matchLabels:
    #     prometheus: somelabel

    ## 如果为 true，prometheus.prometheusSpec.scrapeConfigSelector 的 nil 或 {} 值将导致
    ## 基于 helm 部署中的值创建 prometheus 资源的选择器，
    ## 这也将匹配创建的 scrapeConfigs
    ##
    ## 如果为 null 且 scrapeConfigSelector 也为 null，则从 prometheusSpec 中排除该字段
    ## （保持与 CRD 旧版本的向下兼容性）
    ##
    scrapeConfigSelectorNilUsesHelmValues: true

    ## 选择用于目标发现的 scrapeConfigs。
    ## 如果为 {}，则选择所有 scrapeConfigs
    ##
    scrapeConfigSelector: {}
    ## 示例：选择带有标签 "prometheus" 且值为 "somelabel" 的 scrapeConfigs
    # scrapeConfigSelector:
    #   matchLabels:
    #     prometheus: somelabel

    ## 如果为 nil，则选择自己的命名空间。选择用于 scrapeConfig 发现的命名空间。
    ## 如果为 null，则从 prometheusSpec 中排除该字段（保持与 CRD 旧版本的向下兼容性）
    scrapeConfigNamespaceSelector: {}
    ## 示例：选择命名空间中带有标签 "prometheus" 且值为 "somelabel" 的 scrapeConfig
    # scrapeConfigNamespaceSelector:
    #   matchLabels:
    #     prometheus: somelabel

    ## 指标保留时长
    ##
    retention: 10d

    ## 指标的最大大小
    ##
    retentionSize: ""

    ## 允许在指定时间内摄取乱序/超出范围的样本到 Prometheus
    ## 参考 https://prometheus.io/docs/prometheus/latest/configuration/configuration/#tsdb
    tsdb:
      outOfOrderTimeWindow: 0s

    ## 使用 Snappy 启用预写日志的压缩。
    ##
    walCompression: true

    ## 如果为 true，Operator 将不会处理任何 Prometheus 配置更改
    ##
    paused: false

    ## 为 Prometheus 部署部署的每个分片的副本数。
    ## 副本数乘以分片数是创建的 Pod 总数。
    ##
    replicas: 1

    ## 实验性: 用于分配目标的的分片数。
    ## 副本数乘以分片数是创建的 Pod 总数。
    ## 请注意，缩减分片不会将数据重新分片到剩余的实例上，必须手动移动。
    ## 增加分片也不会重新分片数据，但数据将继续可从同一实例获取。
    ## 要全局查询，请使用 Thanos sidecar 和 Thanos querier 或将数据远程写入中央位置。
    ## 分片是根据 `__address__` 目标元标签的内容进行的。
    ##
    shards: 1

    ## Prometheus 的日志级别
    ##
    logLevel: info

    ## Prometheus 的日志格式
    ##
    logFormat: logfmt

    ## 用于注册路由的前缀，覆盖 externalUrl 路由。
    ## 对重写 URL 的代理很有用。
    ##
    routePrefix: /

    ## 标准对象的元数据。更多信息: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#metadata
    ## 元数据标签和注解会传播到 prometheus Pod。
    ##
    podMetadata: {}
    # labels:
    #   app: prometheus
    #   k8s-app: prometheus

    ## Pod 反亲和性可以阻止调度器将 Prometheus 副本调度到同一节点上。
    ## 默认值 "soft" 意味着调度器应该“倾向于”不将两个副本 Pod 调度到同一节点，但不提供保证。
    ## 值 "hard" 意味着调度器“必须”不将两个副本 Pod 调度到同一节点上。
    ## 值 "" 将禁用 Pod 反亲和性，因此不会配置任何反亲和性规则。
    podAntiAffinity: "soft"

    ## 如果启用了反亲和性，则设置用于反亲和性的 topologyKey。
    ## 例如，可以更改为 failure-domain.beta.kubernetes.io/zone
    ##
    podAntiAffinityTopologyKey: kubernetes.io/hostname

    ## 为 prometheus 实例分配自定义亲和性规则
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
    ##
    affinity: {}
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #     - matchExpressions:
    #       - key: kubernetes.io/e2e-az-name
    #         operator: In
    #         values:
    #         - e2e-az1
    #         - e2e-az2

    ## Prometheus 的 remote_read 规范配置。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#remotereadspec
    remoteRead: []
    # - url: http://remote1/read
    ## additionalRemoteRead 附加到 remoteRead
    additionalRemoteRead: []

    ## Prometheus 的 remote_write 规范配置。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#remotewritespec
    remoteWrite: []
    # - url: http://remote1/push
    ## additionalRemoteWrite 附加到 remoteWrite
    additionalRemoteWrite: []

    ## 启用/禁用 prometheus 远程写入功能的 Grafana 仪表板配置
    remoteWriteDashboards: false

    ## 资源限制和请求
    ##
    resources: {}
    # requests:
    #   memory: 400Mi

    ## 用于持久化数据的 Prometheus StorageSpec
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/platform/storage.md
    ##
    storageSpec: {}
    ## 使用 PersistentVolumeClaim
    ##
    #  volumeClaimTemplate:
    #    spec:
    #      storageClassName: gluster
    #      accessModes: ["ReadWriteOnce"]
    #      resources:
    #        requests:
    #          storage: 50Gi
    #      selector: {}

    ## 使用 tmpfs 卷
    ##
    #  emptyDir:
    #    medium: Memory

    # 输出 StatefulSet 定义上的附加卷。
    volumes: []

    # 输出 StatefulSet 定义上的附加 VolumeMounts。
    volumeMounts: []

    ## AdditionalScrapeConfigs 允许指定附加的 Prometheus 抓取配置。抓取配置
    ## 附加到 Prometheus Operator 生成的配置之后。作业配置必须具有
    ## 官方 Prometheus 文档中指定的格式:
    ## https://prometheus.io/docs/prometheus/latest/configuration/configuration/#scrape_config。由于抓取配置是
    ## 附加的，用户有责任确保其有效。请注意，使用此功能可能会
    ## 导致 Prometheus 升级失败。建议查看 Prometheus 发行说明，以确保在升级后
    ## 没有不兼容的抓取配置会破坏 Prometheus。
    ## AdditionalScrapeConfigs 可以定义为列表或模板化字符串。
    ##
    ## 下面的抓取配置示例将查找主节点，前提是其名称为 .*mst.*，将端口
    ## 重新标记为 2379，并允许抓取在所有 Kubernetes 主节点上运行的 etcd
    ##
    additionalScrapeConfigs: []
    # - job_name: kube-etcd
    #   kubernetes_sd_configs:
    #     - role: node
    #   scheme: https
    #   tls_config:
    #     ca_file:   /etc/prometheus/secrets/etcd-client-cert/etcd-ca
    #     cert_file: /etc/prometheus/secrets/etcd-client-cert/etcd-client
    #     key_file:  /etc/prometheus/secrets/etcd-client-cert/etcd-client-key
    #   relabel_configs:
    #   - action: labelmap
    #     regex: __meta_kubernetes_node_label_(.+)
    #   - source_labels: [__address__]
    #     action: replace
    #     targetLabel: __address__
    #     regex: ([^:;]+):(\d+)
    #     replacement: ${1}:2379
    #   - source_labels: [__meta_kubernetes_node_name]
    #     action: keep
    #     regex: .*mst.*
    #   - source_labels: [__meta_kubernetes_node_name]
    #     action: replace
    #     targetLabel: node
    #     regex: (.*)
    #     replacement: ${1}
    #   metric_relabel_configs:
    #   - regex: (kubernetes_io_hostname|failure_domain_beta_kubernetes_io_region|beta_kubernetes_io_os|beta_kubernetes_io_arch|beta_kubernetes_io_instance_type|failure_domain_beta_kubernetes_io_zone)
    #     action: labeldrop
    #
    ## 如果抓取配置包含重复部分，您可能希望使用模板。
    ## 在下面的示例中，您可以看到如何为多个区域定义 `gce_sd_configs`
    # additionalScrapeConfigs: |
    #  - job_name: "node-exporter"
    #    gce_sd_configs:
    #    {{range $zone := .Values.gcp_zones}}
    #    - project: "project1"
    #      zone: "{{$zone}}"
    #      port: 9100
    #    {{end}}
    #    relabel_configs:
    #    ...

    ## 如果附加的抓取配置已部署在单个密钥文件中，您可以使用此部分。
    ## 期望值为密钥名称和密钥
    ## 不能与 additionalScrapeConfigs 一起使用
    additionalScrapeConfigsSecret: {}
      # enabled: false
      # name:
      # key:

    ## additionalPrometheusSecretsAnnotations 允许向 kubernetes 密钥添加注解。这对于
    ## 通过 spinnaker 部署以禁用密钥上的版本控制很有用，例如 strategy.spinnaker.io/versioned: 'false'
    additionalPrometheusSecretsAnnotations: {}

    ## AdditionalAlertManagerConfigs 允许以官方 Prometheus 文档中指定的格式进行手动配置
    ## https://prometheus.io/docs/prometheus/latest/configuration/configuration/#alertmanager_config。
    ## 指定的 AlertManager 配置将附加到 Prometheus Operator 生成的配置之后。
    ## 由于 AlertManager 配置是附加的，用户有责任确保其有效。请注意，使用此功能可能会
    ## 导致 Prometheus 升级失败。建议查看 Prometheus 发行说明，以确保在升级后
    ## 没有不兼容的 AlertManager 配置会破坏 Prometheus。
    ## additionalAlertManagerConfigs: []
    # - consul_sd_configs:
    # - server: consul.dev.test:8500
    # scheme: http
    # datacenter: dev
    # tag_separator: ','
    # services:
    # - metrics-prometheus-alertmanager

    ## 如果附加的 alertmanager 配置已部署在单个密钥中，或者您想将其与 helm 部署分开管理，则可以使用此部分。
    ## 期望值为密钥名称和密钥
    ## 不能与 additionalAlertManagerConfigs 一起使用
    additionalAlertManagerConfigsSecret: {}
    # name:
    # key:
    # optional: false

    ## AdditionalAlertRelabelConfigs 允许指定 Prometheus 警报重新标记配置。指定的警报重新标记配置将附加
    ## 到 Prometheus Operator 生成的配置之后。指定的警报重新标记配置必须具有官方
    ## Prometheus 文档中指定的格式：https://prometheus.io/docs/prometheus/latest/configuration/configuration/#alert_relabel_configs。
    ## 由于警报重新标记配置是附加的，用户有责任确保其有效。请注意，使用此功能可能会
    ## 导致 Prometheus 升级失败。建议查看 Prometheus 发行说明，以确保在升级后
    ## 没有不兼容的警报重新标记配置会破坏 Prometheus。
    ## additionalAlertRelabelConfigs: []
    # - separator: ;
    # regex: prometheus_replica
    # replacement: $1
    # action: labeldrop

    ## 如果附加的警报重新标记配置已部署在单个密钥中，或者您想将其与 helm 部署分开管理，则可以使用此部分。
    ## 期望值为密钥名称和密钥
    ## 不能与 additionalAlertRelabelConfigs 一起使用
    additionalAlertRelabelConfigsSecret: {}
    # name:
    # key:

    ## SecurityContext 包含 Pod 级别的安全属性和通用容器设置。
    ## 默认情况下，非 root 用户，uid 为 1000，gid 为 2000。
    ## https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md
    ## securityContext:
    runAsGroup: 2000
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault

    ## 分配给 Pod 的优先级类
    ## priorityClassName: ""

    ## Thanos 配置允许在 Thanos 环境中配置 Prometheus 服务器的各个方面。
    ## 此部分为实验性功能，任何版本都可能发生重大变化，恕不另行通知。
    ## 这是实验性功能，任何版本都可能发生重大变化，不保证向后兼容性。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#thanosspec
    ## thanos: {}
    # secretProviderClass:
    # provider: gcp
    # parameters:
    # secrets: |
    # - resourceName: "projects/$PROJECT_ID/secrets/testsecret/versions/latest"
    # fileName: "objstore.yaml"
    ## ObjectStorageConfig 在 Thanos 中配置对象存储。
    # objectStorageConfig:
    # # 如果已配置，请使用现有密钥，objectStorageConfig.secret 将不被使用
    # existingSecret: {}
    # # name: ""
    # # key: ""
    # # 将渲染 objectStorageConfig 密钥数据并配置为供 Thanos 自定义资源使用，
    # # 当 prometheusspec.thanos.objectStorageConfig.existingSecret 设置时将被忽略
    # # https://thanos.io/tip/thanos/storage.md/#s3
    # secret: {}
    # # type: S3
    # # config:
    # # bucket: ""
    # # endpoint: ""
    # # region: ""
    # # access_key: ""
    # # secret_key: ""

    ## Containers 允许注入附加容器。这旨在允许向 Prometheus Pod 添加身份验证代理。
    ## 如果使用代理 extraContainer，则使用代理容器端口更新 targetPort
    containers: []
    # containers:
    # - name: oauth-proxy
    # image: quay.io/oauth2-proxy/oauth2-proxy:v7.10.0
    # args:
    # - --upstream=http://127.0.0.1:9090
    # - --http-address=0.0.0.0:8081
    # - --metrics-address=0.0.0.0:8082
    # - ...
    # ports:
    # - containerPort: 8081
    # name: oauth-proxy
    # protocol: TCP
    # - containerPort: 8082
    # name: oauth-metrics
    # protocol: TCP
    # resources: {}

    ## InitContainers 允许注入附加的 initContainers。这旨在允许在启动 Prometheus
    ## 之前对挂载的卷进行一些更改（权限、目录树）
    initContainers: []

    ## 用于 Prometheus 的端口名称。
    ## portName: "http-web"

    ## ArbitraryFSAccessThroughSMs 配置基于服务监控器的配置是否可以访问
    ## Prometheus 容器文件系统上的任意文件，例如持票人令牌文件。
    arbitraryFSAccessThroughSMs: false

    ## OverrideHonorLabels 如果设置为 true，则覆盖所有用户配置的 honor_labels。如果在 ServiceMonitor
    ## 或 PodMonitor 中将 HonorLabels 设置为 true，则这将把 honor_labels 覆盖为 false。
    overrideHonorLabels: false

    ## OverrideHonorTimestamps 允许全局强制在所有抓取配置中遵守时间戳。
    overrideHonorTimestamps: false

    ## 当 ignoreNamespaceSelectors 设置为 true 时，所有 PodMonitor、ServiceMonitor 和 Probe 对象的 namespaceSelector 将被忽略，
    ## 它们将仅发现 PodMonitor、ServiceMonitor 和 Probe 对象命名空间内的目标，
    ## 并且服务监控器将安装在默认服务命名空间中。
    ## 默认为 false。
    ignoreNamespaceSelectors: false

    ## EnforcedNamespaceLabel 强制为每个用户创建的警报和指标添加一个源命名空间标签。
    ## 标签值将始终是正在创建的对象的命名空间。
    ## 默认禁用
    enforcedNamespaceLabel: ""

    ## PrometheusRulesExcludedFromEnforce - 被排除在强制添加命名空间标签之外的 prometheus 规则列表。
    ## 仅在 enforcedNamespaceLabel 设置为 true 时有效。确保为每对都设置了 ruleNamespace 和 ruleName
    ## 已弃用，请改用 `excludedFromEnforcement`
    prometheusRulesExcludedFromEnforce: []

    ## ExcludedFromEnforcement - 被排除在强制添加源命名空间标签之外的 PodMonitor、ServiceMonitor、Probe 和 PrometheusRule 对象的引用列表。
    ## 仅在 enforcedNamespaceLabel 设置为 true 时有效。
    ## 参考 https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#objectreference
    excludedFromEnforcement: []

    ## QueryLogFile 指定用于记录 PromQL 查询的文件。请注意，此位置必须可写，
    ## 并且可以使用附加卷进行持久化。或者，位置可以设置为 stdout 位置，例如
    ## /dev/stdout，以将查询信息记录到默认的 Prometheus 日志流。此功能仅在 Prometheus >= 2.16.0
    ## 版本中可用。有关更多详细信息，请参阅 Prometheus 文档 (https://prometheus.io/docs/guides/query-log/)
    queryLogFile: false

    # 用于为 Prometheus 设置全局 sample_limit。这可作为 ServiceMonitor 或/和 PodMonitor 的默认 SampleLimit。
    # 设置为 'false' 以禁用全局 sample_limit。或设置为数字以覆盖默认值。
    sampleLimit: false

    # EnforcedKeepDroppedTargetsLimit 定义了因重新标记而被丢弃的保留在内存中的目标数量。
    # 该值将覆盖 ServiceMonitor、PodMonitor、Probe 对象设置的任何 spec.keepDroppedTargets，除非 spec.keepDroppedTargets
    # 大于零且小于 spec.enforcedKeepDroppedTargets。0 表示无限制。
    enforcedKeepDroppedTargets: 0

    ## EnforcedSampleLimit 定义了全局可接受的抓取样本数限制。这会覆盖每个 ServiceMonitor 或/和 PodMonitor
    ## 设置的任何 SampleLimit。它旨在供管理员用于强制 SampleLimit 以保持样本/序列的总数
    ## 在所需限制之下。请注意，如果 SampleLimit 较低，将使用该值。
    enforcedSampleLimit: false

    ## EnforcedTargetLimit 定义了全局可接受的抓取目标数限制。这会覆盖每个 ServiceMonitor 或/和 PodMonitor
    ## 设置的任何 TargetLimit。它旨在供管理员用于强制 TargetLimit 以保持目标总数
    ## 在所需限制之下。请注意，如果 TargetLimit 较低，将使用该值，但如果任一值为零，
    ## 则使用非零值。如果两个值都为零，则不强制执行限制。
    enforcedTargetLimit: false

    ## 每个抓取可接受的标签数限制。如果在指标重新标记后存在多于此数量的标签，
    ## 整个抓取将被视为失败。0 表示无限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    enforcedLabelLimit: false

    ## 每个抓取可接受的标签名长度限制。如果标签名在指标重新标记后长于此数量，
    ## 整个抓取将被视为失败。0 表示无限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    enforcedLabelNameLengthLimit: false

    ## 每个抓取可接受的标签值长度限制。如果标签值在指标重新标记后长于此数量，
    ## 整个抓取将被视为失败。0 表示无限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    enforcedLabelValueLengthLimit: false

    ## AllowOverlappingBlocks 启用 Prometheus 中的垂直压缩和垂直查询合并。这在 Prometheus 中
    ## 仍处于实验阶段，因此在任何即将发布的版本中都可能发生变化。
    allowOverlappingBlocks: false

    ## 指定指标和标签名称的验证方案。
    ## 支持的值有：Legacy, UTF8
    nameValidationScheme: ""

    ## 新创建的 Pod 至少需要保持就绪的秒数，而其任何容器都没有崩溃，才能被视为可用。
    ## 默认为 0（Pod 一旦准备就绪即被视为可用）。
    minReadySeconds: 0

    # 对于使用自定义 CNI（如 calico）的托管 Kubernetes 集群（如 AWS EKS），
    # 因为 AWS 管理的控制平面无法与 Pod 的 IP CIDR 通信，并且准入 webhook 不起作用
    # 如果为 true，则使用主机的网络命名空间。请务必了解启用此功能时的安全影响。
    # 启用 hostNetwork 后，dnsPolicy 将自动设置为 ClusterFirstWithHostNet。
    hostNetwork: false

    # HostAlias 包含 IP 和主机名之间的映射，将被注入到 Pod 的 hosts 文件中。
    hostAliases: []
    # - ip: 10.10.0.100
    # hostnames:
    # - a1.app.local
    # - b1.app.local

    ## TracingConfig 在 Prometheus 中配置跟踪。
    ## 参考 https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#prometheustracingconfig
    tracingConfig: {}

    ## 定义用于从 ServiceMonitor 对象和 Alertmanager 端点发现目标的发现角色。
    ## 如果设置，该值应为 "Endpoints" 或 "EndpointSlice"。如果未设置，operator 假定为 "Endpoints" 角色。
    serviceDiscoveryRole: ""

    ## 未被上述属性覆盖的附加配置。（通过 tpl 传递）
    additionalConfig: {}

    ## 未被上述属性覆盖的附加配置。
    ## 如果您需要 alertmanagerSpec 内的高级模板，则很有用。
    ## 否则，请使用 prometheus.prometheusSpec.additionalConfig（通过 tpl 传递）
    additionalConfigString: ""

    ## 定义 `prometheus` 容器的启动探针在被视为失败之前将等待的最长时间（秒）。
    ## WAL 重放完成后，启动探针将返回成功。如果设置，该值应大于 60（秒）。
    ## 否则，它将等于 900 秒（15 分钟）。
    maximumStartupDurationSeconds: 0

    ## 为 Prometheus 实例设置默认的 scrapeProtocols
    ## https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#scrapeprotocolstring-alias
    scrapeProtocols: []

    additionalRulesForClusterRole: []
    # - apiGroups: [ "" ]
    # resources:
    # - nodes/proxy
    # verbs: [ "get", "list", "watch" ]

    additionalServiceMonitors: []
  ## 要创建的 ServiceMonitor 的名称
  ##
  # - name: ""

  ## 用于 ServiceMonitorSelector 的附加标签。与图表的标准标签一起使用。
  ##
  # additionalLabels: {}

  ## 用于将作业名称组装成 <标签值>-<端口> 形式的服务标签。
  ## 如果未指定标签，则使用服务名称。
  ##
  # jobLabel: ""

  ## 从 Kubernetes 服务转移到目标的标签
  ##
  # targetLabels: []

  ## 从 Kubernetes Pods 转移到目标的标签
  ##
  # podTargetLabels: []

  ## 适用于此 ServiceMonitor 的服务标签选择器。
  ##
  # selector: {}
    ## 示例：选择所有带有标签 "monitoredby"，并且其值是 "example-service-1" 或 "example-service-2" 的服务。
    ##
    # matchExpressions:
    #   - key: "monitoredby"
    #     operator: In
    #     values:
    #       - example-service-1
    #       - example-service-2
    ## 服务的标签选择器
##
# matchLabels: {}

## 选择服务的命名空间
##
# namespaceSelector:
  ## 匹配所有命名空间
  ##
  # any: false

  ## 明确列出要选择的命名空间名称
  ##
  # matchNames: []

## 要监控的所选服务的端点
##
# endpoints: []
  ## 端点服务端口的名称
  ## 与 targetPort 互斥
  # - port: ""

  ## 端点目标端口的名称或编号
  ## 与 port 互斥
  # - targetPort: ""

  ## 包含用于抓取目标的 bearer token 的文件
  ##
  #   bearerTokenFile: ""

  ## 抓取指标的间隔时间
  ##
  #   interval: 30s

  ## 抓取指标的 HTTP 路径
  ##
  #   path: /metrics

  ## 用于抓取的 HTTP 方案
  ##
  #   scheme: http

  ## 抓取端点时使用的 TLS 配置
  ##
  #   tlsConfig:

    ## CA 文件的路径
    ##
    # caFile: ""

    ## 客户端证书文件的路径
    ##
    # certFile: ""

    ## 跳过证书验证
    ##
    # insecureSkipVerify: false

    ## 客户端密钥文件的路径
    ##
    # keyFile: ""

    ## 用于验证主机名的服务器名称
    ##
    # serverName: ""

  ## 抓取后、摄取前应用于样本的指标重新标记配置。
  ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
  ##
  # metricRelabelings: []
  # - action: keep
  #   regex: 'kube_(daemonset|deployment|pod|namespace|node|statefulset).+'
  #   sourceLabels: [__name__]

  ## 抓取前应用于样本的重新标记配置
  ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
  ##
  # relabelings: []
  # - sourceLabels: [__meta_kubernetes_pod_node_name]
  #   separator: ;
  #   regex: ^(.*)$
  #   targetLabel: nodename
  #   replacement: $1
  #   action: replace

## Prometheus 用于抓取指标的回退抓取协议
## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#monitoring.coreos.com/v1.ScrapeProtocol
##
# fallbackScrapeProtocol: ""

additionalPodMonitors: []
## 要创建的 PodMonitor 的名称
##
# - name: ""

  ## 用于 PodMonitorSelector 的附加标签。与图表的标准标签一起使用。
  ##
  # additionalLabels: {}

  ## 用于将作业名称组装成 <标签值>-<端口> 形式的 Pod 标签
  ## 如果未指定标签，则使用 Pod 端点名称
  ##
  # jobLabel: ""

  ## 适用于此 PodMonitor 的 Pod 标签选择器
  ##
  # selector: {}
    ## 示例：选择所有带有标签 "monitoredby"，并且其值是 "example-pod-1" 或 "example-pod-2" 的 Pod
    ##
    # matchExpressions:
    #   - key: "monitoredby"
    #     operator: In
    #     values:
    #       - example-pod-1
    #       - example-pod-2

    ## Pods 的标签选择器
    ##
    # matchLabels: {}

  ## PodTargetLabels 将 Kubernetes Pod 上的标签转移到目标。
  ##
  # podTargetLabels: {}

  ## SampleLimit 定义了每个抓取可接受的样本数限制。
  ##
  # sampleLimit: 0

  ## 选择 Pod 的命名空间
  ##
  # namespaceSelector:
    ## 匹配任何命名空间
    ##
    # any: false

    ## 明确列出要选择的命名空间名称
    ##
    # matchNames: []

  ## 要监控的所选 Pod 的端点
  ## https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#podmetricsendpoint
  ##
  # podMetricsEndpoints: []

  ## Prometheus 用于抓取指标的回退抓取协议
  ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#monitoring.coreos.com/v1.ScrapeProtocol
  ##
  # fallbackScrapeProtocol: ""

## thanosRuler 的配置
## 参考: https://thanos.io/tip/components/rule.md/
##
thanosRuler:

  ## 部署 thanosRuler
  ##
  enabled: false

  ## ThanosRuler 的注解
  ##
  annotations: {}

  ## ThanosRuler 使用的服务账户
  ## 参考: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  ##
  serviceAccount:
    create: true
    name: ""
    annotations: {}

  ## 为 ThanosRuler 配置 pod 破坏预算
  ## 参考: https://kubernetes.io/docs/tasks/run-application/configure-pdb/#specifying-a-poddisruptionbudget
  ##
  podDisruptionBudget:
    enabled: false
    minAvailable: 1
    # maxUnavailable: ""
    unhealthyPodEvictionPolicy: AlwaysAllow

  ingress:
    enabled: false

    ingressClassName: ""

    annotations: {}

    labels: {}

    ## 如果启用了 Ingress，则必须提供主机名
    ##
    hosts: []
      # - thanosruler.domain.com

    ## 用于 ingress 规则的路径 - 一个路径应与 thanosruler.routePrefix 匹配
    ##
    paths: []
    # - /

    ## 对于 Kubernetes >= 1.18，您应该指定 pathType（决定如何匹配 Ingress 路径）
    ## 参考: https://kubernetes.io/blog/2020/04/02/improvements-to-the-ingress-api-in-kubernetes-1.18/#better-path-matching-with-path-types
    # pathType: ImplementationSpecific

    ## ThanosRuler Ingress 的 TLS 配置
    ## 密钥必须在命名空间中手动创建
    ##
    tls: []
    # - secretName: thanosruler-general-tls
    #   hosts:
    #   - thanosruler.example.com

  # -- BETA: 在此处配置图表的网关路由。
  # 可以通过添加像 'main' 路由一样的字典键来添加更多路由。
  # 请注意，这是此功能的早期 beta 版本，
  # kube-prometheus-stack 不保证其工作并可能发生变化。
  # 由于是 BETA，此功能将来可能/将会更改，恕不另行通知，除非您愿意承担风险，否则请勿使用
  # [[参考]](https://gateway-api.sigs.k8s.io/reference/spec/#gateway.networking.k8s.io%2fv1alpha2)
  route:
    main:
      # -- 启用或禁用路由
      enabled: false

      # -- 设置路由 apiVersion，例如 gateway.networking.k8s.io/v1 或 gateway.networking.k8s.io/v1alpha2
      apiVersion: gateway.networking.k8s.io/v1
      # -- 设置路由类型
      # 有效选项为 GRPCRoute, HTTPRoute, TCPRoute, TLSRoute, UDPRoute
      kind: HTTPRoute

      annotations: {}
      labels: {}

      hostnames: []
      # - my-filter.example.com
      parentRefs: []
      # - name: acme-gw

      # -- 创建用于重定向的 http 路由 (https://gateway-api.sigs.k8s.io/guides/http-redirect-rewrite/#http-to-https-redirects)
      ## 请注意，仅在网关的 http 监听器上启用此功能，以避免无限重定向。
      ## 如果此项设置为 true，matches、filters 和 additionalRules 将被忽略。
      httpsRedirect: false

      matches:
        - path:
            type: PathPrefix
            value: /

      ## 过滤器定义应用于与此规则匹配的请求的过滤器。
      filters: []

      ## 可添加到路由的附加自定义规则
      additionalRules: []

  ## ThanosRuler 服务配置
  ##
  service:
    enabled: true
    annotations: {}
    labels: {}
    clusterIP: ""
    ipDualStack:
      enabled: false
      ipFamilies: ["IPv6", "IPv4"]
      ipFamilyPolicy: "PreferDualStack"

    ## ThanosRuler 服务监听的端口
    ##
    port: 10902
    ## 与代理 extraContainer 端口一起使用
    ##
    targetPort: 10902
    ## 在每个节点上暴露的端口
    ## 仅在 service.type 为 'NodePort' 时使用
    ##
    nodePort: 30905
    ## Prometheus 服务器服务可用的 IP 地址列表
    ## 参考: https://kubernetes.io/docs/concepts/services-networking/service/#external-ips
    ##

    ## ThanosRuler 服务要打开的附加端口
    additionalPorts: []

    externalIPs: []
    loadBalancerIP: ""
    loadBalancerSourceRanges: []

    ## 表示此服务是否希望将外部流量路由到节点本地或集群范围的端点
    ##
    externalTrafficPolicy: Cluster

    ## 服务类型
    ##
    type: ClusterIP

  ## 为 ThanosRuler 服务创建 ServiceMonitor 的配置
  ##
  serviceMonitor:
    ## 如果为 true，则为 thanosRuler 创建一个 serviceMonitor
    ##
    selfMonitor: true

    ## 抓取间隔。如果未设置，则使用 Prometheus 默认的抓取间隔。
    ##
    interval: ""

    ## 附加标签
    ##
    additionalLabels: {}

    ## SampleLimit 定义了每个抓取可接受的样本数限制。
    ##
    sampleLimit: 0

    ## TargetLimit 定义了可接受的抓取目标数的限制。
    ##
    targetLimit: 0

    ## 每个抓取可接受的标签数的限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelLimit: 0

    ## 每个抓取可接受的标签名长度的限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelNameLengthLimit: 0

    ## 每个抓取可接受的标签值长度的限制。仅在 Prometheus 2.27.0 及更高版本中有效。
    ##
    labelValueLengthLimit: 0

    ## proxyUrl: 应用于抓取的代理 URL。
    ##
    proxyUrl: ""

    ## scheme: 用于抓取的 HTTP 方案。例如，与 `tlsConfig` 一起使用以支持 istio mTLS。
    scheme: ""

    ## tlsConfig: 用于抓取端点时使用的 TLS 配置。例如，与 istio mTLS 一起使用。
    ## 类型: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#tlsconfig
    tlsConfig: {}

    bearerTokenFile:

    ## 抓取后、摄取前应用于样本的指标重新标记配置。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    metricRelabelings: []
    # - action: keep
    #   regex: 'kube_(daemonset|deployment|pod|namespace|node|statefulset).+'
    #   sourceLabels: [__name__]

    ## 抓取前应用于样本的重新标记配置
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#relabelconfig
    ##
    relabelings: []
    # - sourceLabels: [__meta_kubernetes_pod_node_name]
    #   separator: ;
    #   regex: ^(.*)$
    #   targetLabel: nodename
    #   replacement: $1
    #   action: replace

    ## 附加端点
    ##
    additionalEndpoints: []
    # - port: oauth-metrics
    #   path: /metrics

  ## 影响 thanosRulerpec 的设置
  ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#thanosrulerspec
  ##
  thanosRulerSpec:
    ## 标准对象的元数据。更多信息: https://github.com/kubernetes/community/blob/master/contributors/devel/sig-architecture/api-conventions.md#metadata
    ## 元数据标签和注解会传播到 ThanosRuler Pods。
    ##
    podMetadata: {}

    ##
    serviceName:

    ## ThanosRuler 的镜像
    ##
    image:
      registry: quay.io
      repository: thanos/thanos
      tag: v0.39.1
      sha: ""

    ## 选择用于 PrometheusRules 发现的命名空间。
    ## 如果为 nil，则选择自己的命名空间。
    ## 有关用法，请参阅 https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#namespaceselector
    ##
    ruleNamespaceSelector: {}

    ## 如果为 true，则 thanosRuler.thanosRulerSpec.ruleSelector 的 nil 或 {} 值将导致
    ## Prometheus 资源使用基于 helm 部署中的值创建的选择器，
    ## 这也将匹配创建的 PrometheusRule 资源
    ##
    ruleSelectorNilUsesHelmValues: true

    ## 选择用于目标发现的 PrometheusRules
    ## 如果为 {}，则选择所有 PrometheusRules
    ##
    ruleSelector: {}
    ## 示例：选择所有带有标签 "prometheus" 且值为 "example-rules" 或 "example-rules-2" 的 PrometheusRules 资源
    # ruleSelector:
    #   matchExpressions:
    #     - key: prometheus
    #       operator: In
    #       values:
    #         - example-rules
    #         - example-rules-2
    #
    ## 示例：选择所有带有标签 "role" 且值为 "example-rules" 的 PrometheusRules 资源
    # ruleSelector:
    #   matchLabels:
    #     role: example-rules

    ## 定义日志格式
    # 使用 logfmt (默认) 或 json 日志记录
    logFormat: logfmt

    ## ThanosRuler 配置的日志级别
    ##
    logLevel: info

    ## Size 是 ThanosRuler 集群的预期大小。控制器最终会使正在运行的集群大小等于预期大小。
    replicas: 1

    ## ThanosRuler 将保留数据的时间。默认是 '24h'，并且必须匹配正则表达式
    ## [0-9]+(ms|s|m|h)（毫秒、秒、分钟、小时）。
    ##
    retention: 24h

    ## 连续评估之间的间隔
    ##
    evaluationInterval: ""

    ## Storage 是 ThanosRuler 实例将如何使用存储的定义。
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/platform/storage.md
    ##
    storage: {}
    # volumeClaimTemplate:
    #   spec:
    #     storageClassName: gluster
    #     accessModes: ["ReadWriteOnce"]
    #     resources:
    #       requests:
    #         storage: 50Gi
    #     selector: {}

    ## AlertmanagerConfig 定义了连接到 alertmanager 的配置。
    ## 仅在 Thanos v0.10.0 及更高版本中可用。映射到 alertmanagers.config Thanos Ruler 参数。
    alertmanagersConfig:
      # 如果已配置，则使用现有密钥，alertmanagersConfig.secret 将不被使用
      existingSecret: {}
        # name: ""
        # key: ""
      # 将渲染 alertmanagersConfig 密钥数据并配置为供 Thanos Ruler 自定义资源使用，当 alertmanagersConfig.existingSecret 设置时将被忽略
      # https://thanos.io/tip/components/rule.md/#alertmanager
      secret: {}
        # alertmanagers:
        # - api_version: v2
        #   http_config:
        #     basic_auth:
        #       username: some_user
        #       password: some_pass
        #   static_configs:
        #     - alertmanager.thanos.io
        #   scheme: http
        #   timeout: 10s

    ## DEPRECATED。定义用于向 Alertmanager 发送警报的 URL。对于 Thanos v0.10.0 及更高版本，应使用 alertmanagersConfig。
    ## 注意: 如果指定了 alertmanagersConfig，则此字段将被忽略。映射到 alertmanagers.url Thanos Ruler 参数。
    # alertmanagersUrl:

    ## Thanos Ruler 实例可用的外部 URL。这是生成正确 URL 所必需的。如果 Thanos Ruler 不在 DNS 名称的根目录提供服务，则这是必需的。字符串 false
    ##
    externalPrefix:

    ## 如果为 true，http://{{ template "kube-prometheus-stack.thanosRuler.name" . }}.{{ template "kube-prometheus-stack.namespace" . }}:{{ .Values.thanosRuler.service.port }}
    ## 将用作 externalPrefix 的值
    externalPrefixNilUsesHelmValues: true

    ## ThanosRuler 注册 HTTP 处理程序的路由前缀。这很有用，如果使用 ExternalURL 并且代理正在重写请求的 HTTP 路由，而实际的 ExternalURL 仍然为 true，
    ## 但服务器在不同的路由前缀下提供服务。例如与 kubectl proxy 一起使用。
    ##
    routePrefix: /

    ## ObjectStorageConfig 在 Thanos 中配置对象存储
    objectStorageConfig:
      # 如果已配置，则使用现有密钥，objectStorageConfig.secret 将不被使用
      existingSecret: {}
        # name: ""
        # key: ""
      # 将渲染 objectStorageConfig 密钥数据并配置为供 Thanos Ruler 自定义资源使用，当 objectStorageConfig.existingSecret 设置时将被忽略
      # https://thanos.io/tip/thanos/storage.md/#s3
      secret: {}
        # type: S3
        # config:
        #   bucket: ""
        #   endpoint: ""
        #   region: ""
        #   access_key: ""
        #   secret_key: ""

    ## 在发送到 alertmanager 之前按名称删除的标签
    ## 映射到 thanos ruler 的 --alert.label-drop 标志。
    alertDropLabels: []

    ## QueryEndpoints 定义了要从中查询指标的 Thanos querier 端点
    ## 映射到 thanos ruler 的 --query 标志。
    queryEndpoints: []

    ## 定义连接到 thanos query 实例的配置。如果定义了此项，则 queryEndpoints 字段将被忽略。
    ## 映射到 query.config CLI 参数。仅在 thanos v0.11.0 及更高版本中可用。
    queryConfig:
      # 如果已配置，则使用现有密钥，queryConfig.secret 将不被使用
      existingSecret: {}
        # name: ""
        # key: ""
      # 渲染 queryConfig 密钥数据并配置为供 Thanos Ruler 自定义资源使用，当 queryConfig.existingSecret 设置时将被忽略
      # https://thanos.io/tip/components/rule.md/#query-api
      secret: {}
        # - http_config:
        #     basic_auth:
        #       username: some_user
        #       password: some_pass
        #   static_configs:
        #     - URL
        #   scheme: http
        #   timeout: 10s

    ## Labels 配置 ThanosRuler 的外部标签对。一个默认的副本
    ## 标签 `thanos_ruler_replica` 将始终作为标签添加，其值为
    ## pod 的名称，并且它将在警报中被删除。
    labels: {}

    ## 如果设置为 true，则不会对底层管理的对象执行任何操作，除了删除操作。
    ##
    paused: false

    ## 允许为 ThanosRuler 容器设置附加参数
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#thanosruler
    ##
    additionalArgs: []
      # - name: remote-write.config
      #   value: |-
      #     "remote_write":
      #     - "name": "receiver-0"
      #       "remote_timeout": "30s"
      #       "url": "http://thanos-receiver-0.thanos-receiver:8081/api/v1/receive"

    ## 定义 Pod 调度到的节点
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/#nodeselector
    ##
    nodeSelector: {}

    ## 为单个 Pod 定义资源请求和限制。
    ## 参考: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
    ##
    resources: {}
    # requests:
    #   memory: 400Mi

    ## Pod 反亲和性可以阻止调度器将 Prometheus 副本调度到同一节点上。
    ## 默认值 "soft" 意味着调度器应该“倾向于”不将两个副本 Pod 调度到同一节点，但不提供保证。
    ## 值 "hard" 意味着调度器“必须”不将两个副本 Pod 调度到同一节点上。
    ## 值 "" 将禁用 Pod 反亲和性，因此不会配置任何反亲和性规则。
    ##
    podAntiAffinity: "soft"

    ## 如果启用了反亲和性，则设置用于反亲和性的 topologyKey。
    ## 例如，可以更改为 failure-domain.beta.kubernetes.io/zone
    ##
    podAntiAffinityTopologyKey: kubernetes.io/hostname

    ## 为 thanosRuler 实例分配自定义亲和性规则
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
    ##
    affinity: {}
    # nodeAffinity:
    #   requiredDuringSchedulingIgnoredDuringExecution:
    #     nodeSelectorTerms:
    #     - matchExpressions:
    #       - key: kubernetes.io/e2e-az-name
    #         operator: In
    #         values:
    #         - e2e-az1
    #         - e2e-az2

    ## 如果指定，Pod 的容忍度。
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/taint-and-toleration/
    ##
    tolerations: []
    # - key: "key"
    #   operator: "Equal"
    #   value: "value"
    #   effect: "NoSchedule"

    ## 如果指定，Pod 的拓扑扩展约束。
    ## 参考: https://kubernetes.io/docs/concepts/scheduling-eviction/topology-spread-constraints/
    ##
    topologySpreadConstraints: []
    # - maxSkew: 1
    #   topologyKey: topology.kubernetes.io/zone
    #   whenUnsatisfiable: DoNotSchedule
    #   labelSelector:
    #     matchLabels:
    #       app: thanos-ruler

    ## SecurityContext 包含 Pod 级别的安全属性和通用容器设置。
    ## 默认情况下，非 root 用户，uid 为 1000，gid 为 2000。*v1.PodSecurityContext false
    ## 参考: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
    ##
    securityContext:
      runAsGroup: 2000
      runAsNonRoot: true
      runAsUser: 1000
      fsGroup: 2000
      seccompProfile:
        type: RuntimeDefault

    ## ListenLocal 使 ThanosRuler 服务器在回环上监听，这样它就不会绑定到 Pod IP。
    ## 注意这仅用于 ThanosRuler UI，不用于 gossip 通信。
    ##
    listenLocal: false

    ## Containers 允许注入附加容器。这旨在允许向 ThanosRuler pod 添加身份验证代理。
    ##
    containers: []

    # 输出 StatefulSet 定义上的附加卷。
    volumes: []

    # 输出 StatefulSet 定义上的附加 VolumeMounts。
    volumeMounts: []

    ## InitContainers 允许注入附加的 initContainers。这旨在允许在启动 prometheus
    ## 之前对挂载的卷进行一些更改（权限、目录树）
    initContainers: []

    ## 分配给 Pods 的优先级类
    ##
    priorityClassName: ""

    ## 用于 ThanosRuler 的端口名称
    ##
    portName: "web"

    ## WebTLSConfig 定义 HTTPS 的 TLS 参数
    ## 参考: https://github.com/prometheus-operator/prometheus-operator/blob/main/Documentation/api-reference/api.md#thanosrulerwebspec
    web: {}

    ## 未被上述属性覆盖的附加配置。（通过 tpl 传递）
    additionalConfig: {}

    ## 未被上述属性覆盖的附加配置。
    ## 如果您需要高级模板，则很有用。
    additionalConfigString: ""

  ## ExtraSecret 可用于在额外的密钥中存储各种数据
  ## (例如，用于存储哈希过的基本认证凭据)
  extraSecret:
    ## 如果未设置，名称将自动生成
    # name: ""
    annotations: {}
    data: {}
  #   auth: |
  #     foo:$apr1$OFG3Xybp$ckL0FHDAkoXYIlH9.cysT0
  #     someoneelse:$apr1$DMZX2Z4q$6SbQIfyuLQd.xmo/P0m2c.

## 将此设置为 true 会生成更干净的资源名称，但需要进行数据迁移，因为持久卷的名称会更改。因此，这应仅在初始安装时设置一次。
##
cleanPrometheusOperatorObjectNames: false

## 要部署的额外清单。可以是 dict 或 list 类型。
## 如果是 dict，则忽略键，仅使用值。
## extraObjects 中包含的项可以定义为 dict 或 string，并通过 tpl 传递。
extraManifests: null
