        # options:
        #   - name: ndots
        #     value: "2"
        #   - name: edns0
      securityContext:
        fsGroup: 65534
        runAsGroup: 65534
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault

      ## 容器特定的安全上下文配置
      ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/
      ##
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop:
            - ALL

      ## 如果为 false，则用户将选择不自动挂载 API 凭据。
      ##
      automountServiceAccountToken: true

    patch:
      enabled: true
      image:
        registry: swr.cn-north-4.myhuaweicloud.com/ddn-k8s/registry.k8s.io
        repository: ingress-nginx/kube-webhook-certgen
        tag: v1.6.0  # 最新标签: https://github.com/kubernetes/ingress-nginx/blob/main/images/kube-webhook-certgen/TAG
        sha: ""
        pullPolicy: IfNotPresent
      resources: {}
      ## 为 webhook 修补作业提供一个优先级类名
      ##
      priorityClassName: ""
      ttlSecondsAfterFinished: 60
      annotations: {}
      #   argocd.argoproj.io/hook: PreSync
      #   argocd.argoproj.io/hook-delete-policy: HookSucceeded
      podAnnotations: {}
      nodeSelector: {}
      affinity: {}
      tolerations: []

      ## SecurityContext 包含 Pod 级别的安全属性和通用容器设置。
