  namespaceOverride: ""
  rbac:
    create: true
  releaseLabel: true

  ## 通过 kubernetes-service-endpoints 启用抓取
  ## 默认禁用，因为 Service Monitor 在下面启用
  ##
  prometheusScrape: false

  prometheus:
    monitor:

      ## 通过 Service Monitor 启用抓取
      ## 如果在上面启用了 prometheusScrape，则禁用以防止重复
      ##
      enabled: true

      ## 抓取间隔。如果未设置，则使用 Prometheus 默认抓取间隔。
      ##
      interval: ""

      ## sampleLimit 定义了每个抓取接受的样本数量限制。
      ##
      sampleLimit: 0

      ## targetLimit 定义了接受的抓取目标数量限制。
      ##
      targetLimit: 0

      ## 每个抓取接受的标签数量限制。仅在 Prometheus 2.27.0 及更高版本中有效。
      ##
      labelLimit: 0

      ## 每个抓取接受的标签名称长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
      ##
      labelNameLengthLimit: 0

      ## 每个抓取接受的标签值长度限制。仅在 Prometheus 2.27.0 及更高版本中有效。
      ##
      labelValueLengthLimit: 0

      ## 抓取超时。如果未设置，则使用 Prometheus 默认抓取超时。
