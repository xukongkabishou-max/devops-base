apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  labels:
    app: jaeger
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      containers:
      - name: jaeger
        image: harbor.aliyun.com/middleware/jaegertracing/jaeger:2.1.0
        resources:
          limits:
            cpu: 2
            memory: 4Gi
          requests:
            cpu: 10m
            memory: 10Mi
        ports:
        - containerPort: 16686
        - containerPort: 4317
        - containerPort: 4318
        - containerPort: 5778
        - containerPort: 9411

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  # labels:
  #   app: jaeger
spec:
  selector:
    app: jaeger
  ports:
  - name: grpc
    port: 4317
    targetPort: 4317
  - name: otlp-http
    port: 4318
    targetPort: 4318
  - name: config
    port: 5778
    targetPort: 5778
  - name: zipkin
    port: 9411
    targetPort: 9411
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: jaeger-nodeport
  labels:
    app: jaeger
spec:
  selector:
    app: jaeger
  ports:
  - name: http-ui
    port: 16686
    targetPort: 16686
    nodePort: 30086
  type: NodePort


---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: jaeger
    release: kube-prom-stack
  name: jaeger
spec:
  endpoints:
  - honorLabels: true
    path: /metrics
    port: http-ui
  namespaceSelector:
    matchNames:
    - observe
  selector:
    matchLabels:
      app: jaeger
