---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    release: kube-prom-stack
  name: ecs-nodes
  namespace: observe
spec:
  endpoints:
  - port: tcp
    params:
      target:
      - xxxxxx:9100
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app: ecs-nodes

---
apiVersion: v1
kind: Service
metadata:
  name: ecs-nodes
  namespace: observe
  labels:
    app: ecs-nodes
spec:
  ports:
  - name: tcp
    port: 9100
    protocol: TCP
    targetPort: 9100


---
apiVersion: v1
kind: Endpoints
metadata:
  name: ecs-nodes
  namespace: observe
  labels:
    app: ecs-nodes
subsets:
- addresses:
  - ip: xxxxxx
  ports:
  - name: tcp
    port: 9100
    protocol: TCP

