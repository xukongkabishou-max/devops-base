---
apiVersion: v1
kind: Service
metadata:
  name: nacos
  namespace: observe
  labels:
    app: nacos-monitor
spec:
  ports:
  - name: nacos
    port: 8848
    protocol: TCP
    targetPort: 8848


---
apiVersion: v1
kind: Endpoints
metadata:
  name: nacos
  namespace: observe
  labels:
    app: nacos-monitor
subsets:
- addresses:
  - ip: xxxxxx
  ports:
  - name: nacos
    port: 8848
    protocol: TCP

---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app: nacos-monitor
    release: kube-prom-stack
  name: nacos
  namespace: observe
spec:
  endpoints:
  - honorLabels: true
    path: /nacos/actuator/prometheus
    port: nacos
  namespaceSelector:
    matchNames:
    - observe
  selector:
    matchLabels:
      app: nacos-monitor

